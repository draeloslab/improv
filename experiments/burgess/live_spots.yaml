actors:
  GUI:
    package: experiments.common_actors.visual_viz_stim
    class: DisplayVisual
    visual: Visual

  # # Microscope actor should be commented out when running a live experiment
  # Microscope:
  #   package: experiments.common_actors.load_disc
  #   class: FileAcquirer
  #   ip: '*'
  #   port: 5007
  #   output: output/
  #   init_filename: output/initialization.h5
  #   filename: data/sample_stream0.h5 #data_032525_ds3.h5
  #   init_frame: 0
  #   framerate: 15

  Acquirer:
    package: actors.acquire_zmq
    class: ZMQAcquirer
    ip: 192.168.1.1 #127.0.0.1 #192.168.1.1 #127.0.0.1 IP address is for running a pseudo-online run
    ports: [50154, 5000,5007,5008,5009,5010,5011,4701,4703,5865,5005,5017,5018] 
    output: output/
    red_chan_image: output/red_channel_image.npy
  
  VideoSaver:
    package: experiments.common_actors.video_saver
    class: VideoSaver
    output: output/
    init_frame: 60
    init_filename: output/initialization.h5
    
  Stimulus:
    package: actors.stimulus
    class: VisualStimulus
    ip: '*'
    port: 6006
    stimuli: stimuli.npy
    grid_pattern: 'rectangular'

  Processor:
    package: experiments.common_actors.caiman_processor
    class: LiveTwoP
    init_filename: output/initialization.h5
    config_file: live_caiman_params.yaml

  Visual:
    package: experiments.common_actors.visual_viz_stim
    class: CaimanVisualStim
    
  Analysis:
    package: experiments.common_actors.analysis
    class: VizStimAnalysis
    stimuli: stimuli.npy
    before_amount: 5
    after_amount: 50
    calc_color: False

  Optimizer:
    package: experiments.common_actors.optimizer
    class: BayesOptimizer #BayesOptimizer #RandomSampler 
    param_file: bayesopt_parameters.yaml
    calibration: True

connections:
  Acquirer.q_out: [Processor.q_in, Visual.raw_frame_queue, VideoSaver.q_in]
  Processor.q_out: [Analysis.q_in]
  Analysis.q_out: [Visual.q_in]
  Acquirer.stim_queue: [Analysis.input_stim_queue, Visual.stim_in]
  Analysis.stim_out: [Optimizer.q_in] 
  Optimizer.stim_ind_out: [Stimulus.stim_ind_in]
  Optimizer.stim_flag_out: [Acquirer.stim_flag_in]
  Optimizer.q_out: [Visual.optim_in]

redis_config:
  port: 6379