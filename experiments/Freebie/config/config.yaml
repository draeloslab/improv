# FES experiment config. Read by the actors at setup; a graph can override any key for ProcessorBatch3D only with
# `config_overrides:` (see graphs/mediapipe_live.yaml). Paths are absolute or relative to experiments/Freebie/.
# The README walks through what each block does to the live data.

# ============================================================================
# General
# ============================================================================
fps: 60                                      # replay frame rate and the One-Euro / 2D Kalman time step; the CAMERAS' rate is
                                             # camera_config.yaml `fps` -- keep the two the same
output_path: '~/predictions'                # run folders: <output_path>/<YYYYMMDD>/<run id>/ (logs + every .npy)

# Scale between the native camera resolution and the frames in the store. With camera_prescaled: true (live TIS
# cameras, which downscale in GStreamer) nothing is resized again; the 2D Processor still uses `resize` to scale its
# angle back to the space the Sender's normalisation constants were calibrated in. Keep at 0.5.
resize: 0.5
camera_prescaled: True

# 2D graphs only: how many preds{N}_in slots SenderUDP polls.
max_camera_slots: 4

# ============================================================================
# Replay input (actors/generator.py)
# ============================================================================
# Generator{N} with camera_num: k plays video_paths[k]; without camera_num it plays video_path.
video_paths:
  0: '/path/to/camera_video_0.mp4'
  1: '/path/to/camera_video_1.mp4'
  2: '/path/to/camera_video_2.mp4'
  3: '/path/to/camera_video_3.mp4'
  4: '/path/to/camera_video_4.mp4'
  5: '/path/to/camera_video_5.mp4'
  6: '/path/to/camera_video_6.mp4'
video_path: '/path/to/camera_video_2.mp4'

# ============================================================================
# 2D per-camera DLC models (old_rig/processor.py, the xPC graphs)
# ============================================================================
model_path_0: '/path/to/dlc-project/dlc-models-pytorch/iteration-0/<shuffle>/train'
model_snapshot_0: "snapshot-best-010.pt"
model_path_1: '/path/to/dlc-project/dlc-models-pytorch/iteration-0/<shuffle>/train'
model_snapshot_1: "snapshot-best-010.pt"
model_path_2: '/path/to/dlc-project/dlc-models-pytorch/iteration-0/<shuffle>/train'
model_snapshot_2: "snapshot-best-010.pt"

# THE confidence threshold.
#   mediapipe + geometric association: hands whose handedness score is below it are ignored.
#   label association / DLC: keypoints below it are dropped before triangulation (or Kalman-estimated, see kalman_*).
#   GUI: keypoints below it are drawn hollow.
threshold: 0.7
# Swap a DLC model's PAF predictor for a heatmap argmax at load time. These models are single-animal, so PAF's
# grouping step only blanks keypoints (60.8% finite vs 100%; median 1.5 px apart where PAF is confident).
single_animal_predictor: true

# ============================================================================
# ProcessorBatch3D (actors/processor_batch3d.py): pose estimator
# ============================================================================
# "mediapipe": Google HandLandmarker (reliable on this rig: handedness scores 0.97-1.0).
# "dlc": the DeepLabCut top-down hand model below (median keypoint likelihood ~0.25 here: comparison only).
# Both give the same 21-keypoint MediaPipe layout per hand.
batch3d_backend: "mediapipe"

# --- mediapipe backend ---
mediapipe_model_path: '/path/to/hand_landmarker.task'   # MediaPipe's HandLandmarker model file
# Hands followed per camera. 2 = the palm detector keeps running while only one hand is visible (~10 ms more per step);
# 1 = faster, but MediaPipe can latch onto a different hand run to run.
mediapipe_num_hands: 2
# Two hand blocks in the output: 42 keypoints, right_* then left_*. MediaPipe assumes a mirrored image, so on raw
# frames its "Left" is the subject's right hand; flip with mediapipe_swap_handedness if the names matter.
mediapipe_both_hands: true
mediapipe_swap_handedness: false
# MediaPipe's own gates on reporting a hand (separate from `threshold`). Very low = keep marginal detections.
mediapipe_min_hand_detection_confidence: 0.02
mediapipe_min_hand_presence_confidence: 0.02
mediapipe_min_tracking_confidence: 0.02
# "video": follow a found hand between frames (far less dropout than "image", which re-detects every frame).
mediapipe_running_mode: "video"
mediapipe_delegate: "CPU"   # MediaPipe's GPU delegate measured 2x slower (71 vs 32.5 ms per 4-camera step)
# How the mediapipe backend runs:
#   "mediapipe" -> MediaPipe's Python wrapper (TFLite, CPU): ~34 ms per 2-camera step.
#   "onnx"      -> actors/hand_onnx.py: the same two networks on onnxruntime, same tracking logic, no landmark smoothing.
# onnx_providers (onnx only): null = CPU (12.6 ms), [CUDAExecutionProvider, CPUExecutionProvider] (3.4 ms),
#   [[TensorrtExecutionProvider, {trt_fp16_enable: true}], CUDAExecutionProvider, CPUExecutionProvider] (2.4 ms; the
#   first start builds and caches the TensorRT engines, ~1 min). Models: scripts/trt/export_onnx.sh -> models/hand_trt/.
mediapipe_engine: "onnx"      # "mediapipe" = stock CPU wrapper (~35 ms per 4-camera step); set per graph in config_overrides to compare
onnx_providers: [[TensorrtExecutionProvider, {trt_fp16_enable: true}], CUDAExecutionProvider, CPUExecutionProvider]
# onnx only: landmark presence a hand needs to be kept (mediapipe_min_hand_presence_confidence applies to the stock
# engine). Junk detections score ~0.04, real hands 0.96-0.99; at 0.3-0.5 the ONNX engine reports the same hands as
# stock MediaPipe in 98% of frames on human video.
onnx_min_presence: 0.5

# --- dlc backend ---
# Top-down DLC model (detector + pose net), 42 keypoints (right_*, then left_*, MediaPipe's 21-keypoint order).
batch3d_model_path: '/path/to/dlc-project/dlc-models-pytorch/iteration-0/<shuffle>/train'
batch3d_model_snapshot: "snapshot-best-160.pt"
batch3d_detector_snapshot: "snapshot-detector-best-200.pt"   # unset for a bottom-up model
# "pytorch" -> DeepLabCut's inference runners (~26 ms per 2-camera step).
# "onnx"    -> actors/dlc_onnx.py on onnxruntime (~5-7 ms, keypoints within 0.03 px of DLC's). Export first with
#              scripts/trt/export_dlc_onnx.py (-> models/dlc_trt/), for the live frame size dlc_onnx_frame_size.
#              Providers as above; the detector stays on CUDA (its NMS has data-dependent shapes TensorRT can't take).
dlc_engine: "onnx"            # "pytorch" = DeepLabCut's own runners, to compare (set per graph in config_overrides)
dlc_onnx_frame_size: [960, 720]
dlc_onnx_det_providers: null
# TensorRT for the pose net saves ~0.5 ms and logs a harmless parse error; the detector is CUDA-only
dlc_onnx_pose_providers: [CUDAExecutionProvider, CPUExecutionProvider]
# dlc_engine "rtmpose_onnx": a one-hand-per-crop DLC hand model (SSDLite detector + RTMPose-m, 21 keypoints per hand, no
# left/right: see hand_side below). Export first: python scripts/trt/export_dlc_rtmpose_onnx.py --project <project>
# (-> models/dlc_rtmpose/). Uses dlc_onnx_frame_size and the dlc_onnx_*_providers above.
dlc_rtmpose_models_dir: null            # null = models/dlc_rtmpose
dlc_rtmpose_det_score: 0.3              # detector confidence for a box to count as a hand (the detector reports from 0.01)
dlc_rtmpose_max_hands: 2                # boxes kept per camera
# Tracking (actors/dlc_rtmpose_onnx.py): a camera holding a hand skips the detector; the next crop is the box around the hand's own
# keypoints from the previous step, grown by track_pad (fraction of the box's long side). The detector (one batched call for all
# cameras that need it) runs only on a camera with no hand, every redetect_every steps on a camera holding fewer than max_hands
# (to find the second hand), and every refresh_every steps on any camera (0 = never). A hand is lost when fewer than
# dlc_min_keypoints keypoints reach dlc_rtmpose_keypoint_min_likelihood. false = detector on every frame.
dlc_rtmpose_track: true
dlc_rtmpose_redetect_every: 15
dlc_rtmpose_refresh_every: 0
dlc_rtmpose_track_pad: 0.1
dlc_rtmpose_keypoint_min_likelihood: 0.3  # keypoints below this are dropped before association (SimCC peak probability)
# Detector box score a hand needs to enter the geometric association. null = dlc_rtmpose_det_score (the box gate above). Not
# `threshold` (0.7, MediaPipe-oriented): this model's boxes score 0.35-0.54 on a new subject, so every hand would be dropped
# before the cameras could agree on it. The reprojection check does the filtering.
dlc_rtmpose_hand_score: null
# Which output block a tracked hand goes in. votes = MediaPipe's handedness (default). position = no handedness needed:
# the hand further left in `camera`'s image gets the `leftmost` block (right|left), the other the other; a lone hand keeps its
# block. Used automatically with dlc_engine rtmpose_onnx (camera: first wired camera, leftmost: right) unless set here.
hand_side: {mode: votes}

# --- 2D Kalman filter (hand_association: label only; actors/kalmanfilter.py) ---
# One filter per camera. Keypoints below `threshold` are estimated by the filter instead of dropped (likelihood 0).
# Smoother but laggier: raise kalman_measurement_var or lower kalman_process_var.
kalman_enabled: true
kalman_max_coast_frames: 15   # drop a keypoint after this many estimated frames in a row
kalman_nderiv: 1              # 1 = position + velocity (~4 ms per camera); 2 adds acceleration (~12 ms; 2 priors)
kalman_priors: [1]
kalman_initial_var: 10
kalman_process_var: 1
kalman_measurement_var: 10

# ============================================================================
# 3D: calibration, association, smoothing
# ============================================================================
# anipose calibration. Live 2D points are rescaled to each camera's calibrated frame size automatically.
calibration_toml: 'calibration/<session>/calibration.toml'
calibration_camera_names: {}   # camera_num -> name in the toml (default "cam{N}")
triangulation_min_cameras: 2          # cameras that must see a keypoint (2 is the geometric minimum)
# "weighted_dlt": each camera's view of a keypoint counts in proportion to its confidence (DLC likelihood; MediaPipe
#                 has only a per-hand score, so there it is close to equal weights) -- actors/triangulate.py.
# "dlt":          aniposelib's CameraGroup.triangulate, every view equal (same result as weighted_dlt with equal weights).
triangulation_method: weighted_dlt
triangulation_min_weight: 0.05        # weight floor for a kept view (2D-Kalman estimates carry likelihood 0)

# How hands are matched across cameras:
#   "geometric": a hand exists in 3D only where cameras agree geometrically (actors/hand_assoc3d.py); tracked frame
#               to frame, right/left from accumulated handedness votes. mediapipe: every detected hand is a candidate;
#               dlc: each camera's right_*/left_* blocks are, with keypoints below `threshold` dropped.
#   "label":    match by MediaPipe's per-camera handedness label (+ the 2D Kalman filter above).
#   "region"    (dlc): one hand held in a fixed place, see held_hand.
hand_association: geometric
geometric_association:
  tol_px: 12                # reprojection error to join a hand. 8 rejected the hand in 61% of the frames it was lost
                            # although both cameras saw it; higher = more coverage, more jumps
  # Hysteresis: a camera that was in the hand last frame stays in while its MEDIAN keypoint error is below this.
  # Without it a 4-camera hand changed camera set ~8.6x/s and each change moved the joint angles 4-5 deg (hold 40:
  # 1.1-2.1 changes/s, >10-deg jumps index 2.6% -> 0.8-1.2%, ring 4.7% -> 1.0-2.2%).
  hold_tol_px: 40
  hand_size_mm: [20, 200]   # plausible wrist -> middle MCP length
  dlc_min_keypoints: 8      # dlc: keypoints at or above `threshold` a right_*/left_* block needs to be a candidate
  gate_mm: 100              # palm movement between frames to stay the same track
  max_miss: 10              # frames a track survives unseen
  # One-Euro filter per keypoint (false = off). min_cutoff (Hz): smoothing at rest; beta: how quickly smoothing
  # relaxes with speed; hold_frames: frames the last hand is repeated when lost; reset_mm: palm jump that restarts it.
  # Measured lag of the smoothed points behind the raw ones: ~50 ms median.
  smooth: {min_cutoff: 1.0, beta: 0.05, hold_frames: 5, reset_mm: 60}   # used only with smoothing_3d.method: one_euro
  reject_gloves: {}         # e.g. {teal: [85, 112, 60]}; no measurable effect with geometric association

# Hold-and-glide on the final 3D points (actors/continuity.py), so angles, GUI and UDP never have gaps or steps:
# a keypoint holds its last value through a gap, and after a gap or a jump > jump_mm glides to the new value
# (glide_alpha of the remaining distance per frame, for glide_frames frames: 63% in ~6 frames). Continuously
# measured keypoints pass through. Raw points are still saved (batch3d_points_3d_raw.npy). null = off.
continuity: {glide_frames: 20, glide_alpha: 0.15, jump_mm: 40}   # used only with smoothing_3d.method: one_euro

# Kinematic hand fit (actors/kinematic_hand.py), before the smoothing: each hand block is replaced by the closest pose
# of a fixed skeleton -- constant bone lengths, joint limits, lost keypoints filled from the rest of the hand.
# model: a hand model file from scripts/build_hand_model.py (built once from runs you trust; mm, so it carries over to
# any session with a board-scaled calibration). A missing side is mirrored from the other.
#   temporal_weight  mm of residual per radian of joint change since the last frame (higher = steadier, laggier)
#   max_rms_mm       a fit further than this from the measured points counts as failed
#   on_fail          raw: keep the measured points that frame; nan: drop the hand
kinematic_fit: {enabled: false, model: null, temporal_weight: 2.0, max_rms_mm: 15, min_keypoints: 8, max_iter: 15, on_fail: raw}

# Smoothing of the final 3D points (actors/kalman3d.py):
#   kalman    constant-velocity Kalman filter per keypoint, timed from the real step times. ~2 ms lag (the One-Euro +
#             glide chain measured 6-36 ms) for slightly more jitter; a lost keypoint is extrapolated for max_predict_s
#             (velocity decaying with coast_tau_s), then held; when found again, or > reset_mm off, it snaps to the
#             measurement instead of gliding. measurement_sd_mm up / accel_sd_mm_s2 down = smoother and laggier.
#   one_euro  the previous chain: geometric_association.smooth (One-Euro) then continuity (hold and glide).
#   none      raw triangulated points (NaN when the hand is lost).
smoothing_3d:
  method: kalman
  kalman: {measurement_sd_mm: 3, accel_sd_mm_s2: 1000, max_predict_s: 0.2, coast_tau_s: 0.1, reset_mm: 60, hold_s: null}

# hand_association: region (dlc backend): 3D of ONE hand that stays in one place (the stimulated hand an
# experimenter holds), from the two-hand DLC model (actors/held_hand3d.py). Its place is learned during the first
# warmup_s seconds (no output then). Validated offline: MCP angles within 1.1-1.5 deg of the offline analysis.
held_hand:
  likelihood: 0.3        # DLC keypoint likelihood to use a point
  max_px: 15             # a 3D point must reproject within this in every camera
  warmup_s: 10           # seconds to learn the hand's place (before stimulation starts)
  hand: 1                # which of the two hands, numbered left -> right in order_camera's image
  order_camera: 2
  radius_mm: 80          # 3D distance from its place
  radius_px: 40          # 2D distance from its usual image position, every camera
  side: left             # output block (left_* joints)
  smooth: {min_cutoff: 1.0, beta: 0.05, max_gap: 5}

# ============================================================================
# CPU core placement (actors/cpu_affinity.py)
# ============================================================================
# i9-14900K: cpu0-15 are the SMT pairs of 8 P-cores, cpu16-31 are 16 E-cores; the same inference ran 1.72x slower
# on an E-core. ProcessorBatch3D claims the first `compute_slots` P-cores, CameraReaders take the next ones, and
# everything else (savers, GUI, sender, BO) runs on the E-cores. enabled: false lets the scheduler decide.
cpu_affinity:
  enabled: true
  compute_slots: 4          # P-cores for ProcessorBatch3D (mediapipe: 31.7 ms on 4 cores vs 29.2 on 7, 4 cameras)
  avoid_cpus: [12, 13]      # handed out last: they carry the cameras' USB interrupt (scripts/setup_realtime.sh moves it)
  # Never used by any actor (physical core 0 is unstable on our rig; [] to use every core). fes-run.sh's FES_CPUS
  # launches everything off it too.
  exclude_cpus: [0, 1]
  overrides: {}             # per-actor CPU lists keyed by log label, e.g. {"Processor cam3": [14, 15]}

# ============================================================================
# Closed-loop stimulation: Bayesian optimisation (actors/bayes_opt.py, actors/brand_link.py)
# ============================================================================
# SenderUDP sends stim requests to SENDER_UDP_IP:stim_port; BRAND answers (stim_on / stim_off / stim_rejected /
# target) to this machine's feedback_port. Env SENDER_STIM_PORT / BRAND_FEEDBACK_PORT override.
brand_link:
  stim_port: 11116
  feedback_port: 11117

bayes_opt:
  # Joints the GPs model and the target is scored on (the processor's joint names; region mode = left_*).
  joints: [left_INDEX_MCP, left_MIDDLE_MCP, left_RING_MCP, left_PINKY_MCP]
  # Analysed runs whose stim_joint_response.csv seed the GPs (joint columns get prior_joint_prefix). [] = from scratch.
  prior_runs: []
  prior_joint_prefix: left_
  refit_every: 10            # trials between hyper-parameter refits (background thread)
  space:                     # candidates = every electrode set x pulse width x frequency x current below
    electrodes: [2, 4, 6, 8, 10, 12, 14, 16]
    pulse_widths: [80, 100, 120, 160, 200]     # us (40 is rejected by the CereStim)
    frequencies: [20, 30, 50, 100]             # Hz (10 rejected); 100 Hz x 1.5 s = 150 pulses (limit 255)
    currents: [1000, 2000, 3000, 4000, 5000]   # uA
    max_electrodes: 8
  timing:                    # s; same windows as the stim analysis (response from on + settle to off, minus baseline)
    stim_duration: 1.5
    rest_duration: 2.5
    settle: 0.5
    baseline: 1.0
    on_timeout: 1.0          # no stim_on this long after the request -> trial abandoned
    off_grace: 0.5           # no stim_off this long after on + duration -> assume the nominal off time
    eval_timeout: 1.0        # evaluate even if frames past stim_off have not arrived by then
  acquisition:
    mode: target             # target = reach BRAND's current target posture; explore = most informative candidate
    kappa: 1.0               # exploration weight (lower confidence bound on the squared error)
  # BRAND's {"fingers": {finger: 0..1}} target -> joint angles (0 = straight, 1 = flexed). PLACEHOLDER angles:
  # set them to the virtual hand's range.
  finger_map:
    index:  {joints: [left_INDEX_MCP],  straight: 0, flexed: 90}
    middle: {joints: [left_MIDDLE_MCP], straight: 0, flexed: 90}
    ring:   {joints: [left_RING_MCP],   straight: 0, flexed: 90}
    pinky:  {joints: [left_PINKY_MCP],  straight: 0, flexed: 90}
  max_trials: 0              # 0 = until stopped

# --- Posture search with Code/BayesOptim (actors/bayes_opt_targets.py + actors/target_search.py) ---
# The base block; a graph picks an experiment block (bo_exp_A, bo_exp_B, bo_exp_C1, bo_exp_C2) with BayesOptTargets'
# `settings:`, which overrides it key by key. Markdown/BO_EXPERIMENTS.md explains every choice; the numbers come from
# notebooks/bo_walkthrough.ipynb (fitted on the 10-21 .. 11-06 stim table, iteration-9 angles).
bayes_opt_targets:
  bayesoptim_path: ~/Code/BayesOptim
  # Outputs (one GP each), live from the 3D keypoints: WRIST_EXT (+ = extension), WRIST_DEV (+ = ulnar),
  # <FINGER>_MCP_FLEX (- = extension), FINGER_EXT (mean MCP extension of the four fingers, + = extension) and
  # FINGER_SPLIT (index/middle extension minus ring/pinky extension). One target value per output.
  outputs: [WRIST_EXT, WRIST_DEV]
  targets: [[15, 0], [10, 12]]
  target_names: null
  target_kind: change        # change = targets are evoked changes; posture = absolute angles (0 = the warm-up posture)
  mode: search               # search = each target until it converges; cycle = visit the targets in turn for ever
  space:                     # candidates = every set of up to max_electrodes x widths x frequencies x currents (26244 here)
    # inside the lab's FES envelope: <= 10 mA, <= 255 us, <= 2.55 uC/phase (10 mA x 250 us = 2.5 uC). Wasp's vision node
    # must allow 10000 uA / 250 us / 100 Hz (it capped 5000 uA / 200 us on 2026-11-11).
    electrodes: [2, 4, 6, 8, 10, 12, 14, 16]
    max_electrodes: 4
    pulse_widths: [50, 75, 100, 125, 150, 175, 200, 225, 250]    # us
    frequencies: [20, 30, 40, 50, 60, 70, 80, 90, 100]           # Hz
    currents: [5000, 10000]          # uA; the table is almost all 5000, so 10000 starts from a weak prior
  optimizer:                 # fixed while running (Losanno); mean of the per-day maximum-likelihood fits
    electrode_length: 1.46   # Matern 5/2 length scale shared by the eight electrode on/off inputs
    param_length: [0.95, 0.55, 0.77]   # ... of width / 300 us, frequency / 100 Hz, amplitude / 6000 uA (ARD)
    prior_sd: [10.5, 7.2]    # per output, deg (WRIST_EXT, WRIST_DEV); FINGER_EXT 25.9, FINGER_SPLIT 9.0
    noise_sd: [3.7, 3.9]     # per output, deg, within a day;           FINGER_EXT 7.6,  FINGER_SPLIT 9.2
    k: 0.5                   # exploration weight in Losanno's rule: -distance + k * SD (tuned: bo_walkthrough section 6)
    converge_repeats: 5      # the same stimulation chosen this many times in a row finishes the target (all three papers)
    max_tests: 40
    init_random: 0           # 0 with a prior_table: start from the prior; else this many random trials first
    seed: 0
    window: 0                # > 0: the GPs only hold the latest `window` trials
    fatigue: null            # null | charge (cumulative mC this session) | time (minutes): an extra GP input
    fatigue_length: 20.0     # its Matern length scale (mC or minutes)
    prior_scale: 0.75        # prior mean = this x the table GPs' prediction (Bonizzato's 0.75; best in section 6)
  regularizer:
    charge_weight: 0.0       # score -= this x (candidate's charge rate / the largest) x |target|
    novelty_weight: 0.0      # score += this x (1 - correlation with the solutions found) x |target|
    solutions_per_target: 1  # > 1: search the target again for a different stimulation after each solution
    exclude_corr: 0.8        # candidates correlated above this with a found solution are not eligible
    unique: null             # electrodes = a found solution's electrode set is not eligible again for that target
    accept_deg: null         # a solution the GPs predict further than this from the target ends that target's search
  timing: {stim_duration: 1.0, rest_duration: 2.0, settle: 0.5, baseline: 1.0, on_timeout: 1.0, off_grace: 0.5, eval_timeout: 1.0}
  wrist: {side: left, warmup_s: 10.0}     # wrist point + zero posture from the first warmup_s seconds (forearm held)
  prior_table: ~/dlc_projects/FESHand21SingleHand-jake-2026-10-21/analysis/stim_table_it9/stim_table.csv
  prior_dates: null          # null = every day in the table
  max_trials: 0              # 0 = no limit

# A: hard multi-angle postures, from the GPs fitted on all data. Change targets; order easy -> stretch.
bo_exp_A:
  outputs: [WRIST_EXT, WRIST_DEV, FINGER_EXT, FINGER_SPLIT]
  target_names: [open_hand, ulnar_wave, radial_wrist_up, reach_for_the_sky, tenodesis_fist, spock_split]
  targets: [[5, 0, 45, 0], [10, 15, 40, 0], [20, -10, 0, 0], [25, 0, 40, 0], [25, 0, -12, 0], [5, 0, 40, 15]]
  optimizer: {prior_sd: [10.5, 7.2, 25.9, 9.0], noise_sd: [3.7, 3.9, 7.6, 9.2]}

# B: a few simple targets, as many different electrode sets as reach each one.
bo_exp_B:
  outputs: [WRIST_EXT, WRIST_DEV]
  target_names: [extension, ulnar, extension_ulnar]
  targets: [[15, 0], [0, 12], [15, 10]]
  regularizer: {charge_weight: 0.2, novelty_weight: 0.3, solutions_per_target: 8, unique: electrodes, accept_deg: 5.0}
  optimizer: {max_tests: 25}

# C1: centre-out over posture targets; the hand is held, then released and droops. Time is a GP input so the GPs
# weigh recent trials more and re-learn after the release (no flag is needed; note the release time in the log).
bo_exp_C1:
  outputs: [WRIST_EXT, WRIST_DEV]
  target_kind: posture
  mode: cycle
  target_names: [neutral, extended, ulnar]
  targets: [[0, 0], [20, 0], [5, 12]]
  optimizer: {fatigue: time, fatigue_length: 5.0}

# C2 (last): one high-charge target, visited for ever (never converges); cumulative charge is a GP input.
bo_exp_C2:
  outputs: [WRIST_EXT, WRIST_DEV, FINGER_EXT]
  mode: cycle
  target_names: [reach_for_the_sky_C2]
  targets: [[20, 0, 35]]           # reachable fresh only with high charge (section 5: best ~8 deg off at 3 electrodes, 4 mA)
  optimizer: {prior_sd: [10.5, 7.2, 25.9], noise_sd: [3.7, 3.9, 7.6], fatigue: charge, fatigue_length: 20.0}
  timing: {stim_duration: 1.9, rest_duration: 2.0}     # ~ the 10-21 fatigue run's 2 s on / 2 s off; BRAND's vision node rejects trains of 2.0 s or more
