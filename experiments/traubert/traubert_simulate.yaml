actors:
  GUI:
    package: experiments.common_actors.visual_viz_stim
    class: DisplayVisual
    visual: Visual

  Microscope:
    package: experiments.common_actors.load_disc
    class: FileAcquirer
    ip: '*'
    port: 5007
    output: output/
    init_filename: /mnt/data/owen/owen_26_01_20/example_fish_caiman_baseline.tif  # unused in practice
    filename: /mnt/data/owen/owen_26_01_20/example_fish_400.tif
    init_frame: 0
    framerate: 1.875

  Acquirer:
    package: actors.acquire_zmq
    class: ZMQAcquirer
    ip: 127.0.0.1
    ports: [50154, 5000,5007,5008,5009,5010,5011,4701,4703,5865,5005,5017,5018] 
    output: output/
    init_filename: /mnt/data/owen/owen_26_01_20/example_fish_caiman_baseline.tif

    init_frame: 400 # todo: check what this actually means
    
  Processor:
    package: experiments.common_actors.caiman_processor
    class: LiveTwoP
    init_filename: /mnt/data/owen/owen_26_01_20/example_fish_caiman_baseline.tif
    config_file: live_caiman_params.yaml

  Visual:
    package: experiments.common_actors.visual_viz_stim
    class: CaimanVisualStim
    
  Analysis:
    package: experiments.common_actors.analysis
    class: VizStimAnalysis
    stimuli: stimuli.npy
    before_amount: 5
    after_amount: 1
    calc_color: False

  StimDesign:
    package: actors.design_stim
    class: ImprovStimDesigner


connections:
  Acquirer.q_out: [Processor.q_in, Visual.raw_frame_queue]
  Processor.q_out: [Analysis.q_in, StimDesign.q_in]
  Analysis.q_out: [Visual.q_in]
  Analysis.stim_out: [StimDesign.stim_q_in] # here to prevent an error; TODO: remove
  Acquirer.stim_queue: [Analysis.input_stim_queue, Visual.stim_in]

redis_config:
  port: 6379
