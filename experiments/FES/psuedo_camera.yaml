actors:
  GUI:
    package: actors.video_screen
    class: Visual
    visual: VideoScreen

  # video screen: displaying the camera video frames
  VideoScreen:
    package: actors.video_screen
    class: VideoScreen
    num_active_cameras: 1
  
  Processor0:
    package: actors.processor
    class: Processor
    pred_active: True

  # Generator:
