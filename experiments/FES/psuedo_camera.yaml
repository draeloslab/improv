    package: actors.camera_reader
    class: CameraReader
    camera_num: 0

  VideoSaver0:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 0
    method: spawn

  Receiver:
    package: actors.recieverActor
    class: Receiver
    method: spawn

