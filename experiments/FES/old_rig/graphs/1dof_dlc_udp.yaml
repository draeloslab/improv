# One camera -> DLC keypoint -> 1-DOF control signal over UDP.
#
#   CameraReader0 ─┬─> Processor0 ─┬─> SenderUDP.preds0_in  ──UDP──> BRAND `vision` node
#                  │               └─> VideoScreen.preds0_in
#                  ├─> VideoScreen.images0_in
#                  └─> VideoSaver2.q_in
#
# Processor (old_rig/processor.py) runs the per-camera DLC model
# (config.yaml: model_path_2 / model_snapshot_2, a PIP-only model) and emits ONE
# scalar per frame: the Y pixel of the PIP keypoint (a 1-keypoint model falls
# into processor.py's "<3 points" branch, which takes prediction[0][1] = y),
# Kalman-filtered and divided by `resize` (full-resolution pixels). Before the
# first detection of a run it is sent as null.
#
# SenderUDP sends [packet_n, {"2": <that scalar>}] to SENDER_UDP_IP:SENDER_UDP_PORT
# (env vars). The BRAND side therefore sees vision_data.angles == {"2": y_px}
# and angles_vec == [y_px]. It is RAW PIXELS, not degrees -- the BRAND graph's
# angle_range is a pixel range [extended, flexed].
#
# VideoSaver2 records camera 2's frames (camera_num indexes active_cameras in
# camera_config.yaml, so it must match CameraReader0's camera_num).

actors:
  GUI:
    package: old_rig.video_screen
    class: Visual
    visual: VideoScreen

  VideoScreen:
    package: old_rig.video_screen
    class: VideoScreen
    num_active_cameras: 1

  Generator0:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 2

  # Generator0:
  #   package: actors.generator
  #   class: Generator
  #   camera_num: 2
  #   video_path: '/path/to/camera_video_2.mp4'

  Processor0:
    package: old_rig.processor
    class: Processor
    pred_active: True
    camera_num: 2
    dlc_engine: onnx     # models/dlc_trt/dlc_bu_cam2.onnx (scripts/trt/export_dlc_bu_onnx.py --camera 2); "pytorch" = DeepLabCut's runner
    method: spawn

  VideoSaver2:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 2
    method: spawn

  SenderUDP:
    package: actors.sender_udp
    class: SenderUDP
    method: spawn

connections:
  Generator0.q_out: [Processor0.q_in, VideoScreen.images0_in, VideoSaver2.q_in]
  Processor0.q_out: [SenderUDP.preds0_in, VideoScreen.preds0_in]

redis_config:
  port: 6379
