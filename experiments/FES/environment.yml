# Conda environment for experiments/FES (the env the rig runs is improvDLC3; this reproduces it).
#
#   conda env create -f experiments/FES/environment.yml      # from the improv repo root
#   conda activate fes
#   export FES_CONDA_ENV=fes                                 # so scripts/fes-run.sh activates it
#
# System packages (not pip-installable) are listed in README.md: tiscamera, GStreamer + its GObject introspection
# data, redis-server, ffmpeg. NVIDIA driver >= 550 for CUDA 12.9.
name: fes
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pycairo          # GStreamer Python bindings for the TIS cameras
  - pygobject
  - ffmpeg
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu129
      - -e ../..                     # improv itself (this repo), editable
      - numpy==1.26.0
      - scipy==1.15.3
      - pyyaml==6.0.2
      - pandas==2.3.2
      - matplotlib==3.8.4
      - PyQt5==5.15.11
      - pyqtgraph==0.14.0
      - opencv-python-headless==4.11.0.86   # headless: its own Qt plugins clash with PyQt5
      - scikit-video==1.1.11
      - pyserial==3.5
      - redis==6.4.0
      - pyzmq==27.0.2
      - protobuf==4.25.9             # mediapipe needs protobuf < 5
      # pose estimation and 3D
      - mediapipe==0.10.14
      - aniposelib==0.8.0
      - torch==2.8.0
      - torchvision==0.23.0
      - deeplabcut==3.0.2
      # fast engines (mediapipe_engine / dlc_engine: onnx); TensorRT is optional (CUDA alone works)
      - onnxruntime-gpu==1.23.2
      - tensorrt-cu12-libs>=10.13,<10.14
      - onnx==1.16.2                 # only for scripts/trt/export_dlc_onnx.py
