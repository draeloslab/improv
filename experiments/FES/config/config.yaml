# FES experiment config. Read by the actors at setup; a graph can override any key for ProcessorBatch3D only with
# `config_overrides:` (see graphs/mediapipe_hand3d_brand.yaml). Paths are absolute or relative to experiments/FES/.
# The README walks through what each block does to the live data.

# ============================================================================
# General
# ============================================================================
fps: 60                                      # replay frame rate and the One-Euro / 2D Kalman time step; the CAMERAS' rate is
                                             # camera_config.yaml `fps` -- keep the two the same
output_path: '/home/chesteklab/predictions'  # run folders: <output_path>/<YYYYMMDD>/<run id>/ (logs + every .npy)

# Scale between the native camera resolution and the frames in the store. With camera_prescaled: true (live TIS
# cameras, which downscale in GStreamer) nothing is resized again; the 2D Processor still uses `resize` to scale its
# angle back to the space the Sender's normalisation constants were calibrated in. Keep at 0.5.
resize: 0.5
camera_prescaled: True

# 2D graphs only: how many preds{N}_in slots SenderUDP polls.
max_camera_slots: 4

# ============================================================================
# Replay input (actors/generator.py)
# ============================================================================
# Generator{N} with camera_num: k plays video_paths[k]; without camera_num it plays video_path.
video_paths:
  0: '/home/chesteklab/camera_video/2026-09-25/130900/camera_video_0_0925_1309.mp4'
  1: '/home/chesteklab/camera_video/2026-09-25/130900/camera_video_1_0925_1309.mp4'
  2: '/home/chesteklab/camera_video/2026-09-25/130900/camera_video_2_0925_1309.mp4'
  3: '/home/chesteklab/camera_video/2026-09-25/130900/camera_video_3_0925_1309.mp4'
  4: '/home/chesteklab/camera_video/2026-09-25/130900/camera_video_4_0925_1309.mp4'
  5: '/home/chesteklab/camera_video/2026-09-25/130900/camera_video_5_0925_1309.mp4'
  6: '/home/chesteklab/camera_video/2026-09-25/130900/camera_video_6_0925_1309.mp4'
video_path: '/home/chesteklab/camera_video/2026-02-27/102051/camera_video_2_0227_1020.mp4'

# ============================================================================
# 2D per-camera DLC models (actors/processor.py, the xPC graphs)
# ============================================================================
model_path_0: '/home/chesteklab/Desktop/rhodesEMG1DOF-jake-2026-09-21/dlc-models-pytorch/iteration-0/rhodesEMG1DOFSep21-trainset95shuffle3/train'
model_snapshot_0: "snapshot-best-010.pt"
model_path_1: '/home/chesteklab/Downloads/all_videos_side_viewFeb8-trainset95shuffle5/train'
model_snapshot_1: "snapshot-best-010.pt"
model_path_2: '/home/chesteklab/Desktop/rhodesEMG1DOF-jake-2026-09-21/dlc-models-pytorch/iteration-0/rhodesEMG1DOFSep21-trainset95shuffle3/train'
model_snapshot_2: "snapshot-best-010.pt"

# THE confidence threshold.
#   mediapipe + geometric association: hands whose handedness score is below it are ignored.
#   label association / DLC: keypoints below it are dropped before triangulation (or Kalman-estimated, see kalman_*).
#   GUI: keypoints below it are drawn hollow.
threshold: 0.3
# Swap a DLC model's PAF predictor for a heatmap argmax at load time. These models are single-animal, so PAF's
# grouping step only blanks keypoints (60.8% finite vs 100%; median 1.5 px apart where PAF is confident).
single_animal_predictor: true

# ============================================================================
# ProcessorBatch3D (actors/processor_batch3d.py): pose estimator
# ============================================================================
# "mediapipe": Google HandLandmarker (reliable on this rig: handedness scores 0.97-1.0).
# "dlc": the DeepLabCut top-down hand model below (median keypoint likelihood ~0.25 here: comparison only).
# Both give the same 21-keypoint MediaPipe layout per hand.
batch3d_backend: "mediapipe"

# --- mediapipe backend ---
mediapipe_model_path: '/home/chesteklab/Desktop/hand-tracking-notebooks-jake-2026-08-17/mediapipe/hand_landmarker.task'
# Hands followed per camera. 2 = the palm detector keeps running while only one hand is visible (~10 ms more per step);
# 1 = faster, but MediaPipe can latch onto a different hand run to run.
mediapipe_num_hands: 2
# Two hand blocks in the output: 42 keypoints, right_* then left_*. MediaPipe assumes a mirrored image, so on raw
# frames its "Left" is the subject's right hand; flip with mediapipe_swap_handedness if the names matter.
mediapipe_both_hands: true
mediapipe_swap_handedness: false
# MediaPipe's own gates on reporting a hand (separate from `threshold`). Very low = keep marginal detections.
mediapipe_min_hand_detection_confidence: 0.02
mediapipe_min_hand_presence_confidence: 0.02
mediapipe_min_tracking_confidence: 0.02
# "video": follow a found hand between frames (far less dropout than "image", which re-detects every frame).
mediapipe_running_mode: "video"
mediapipe_delegate: "CPU"   # MediaPipe's GPU delegate measured 2x slower (71 vs 32.5 ms per 4-camera step)
# How the mediapipe backend runs:
#   "mediapipe" -> MediaPipe's Python wrapper (TFLite, CPU): ~34 ms per 2-camera step.
#   "onnx"      -> actors/hand_onnx.py: the same two networks on onnxruntime, same tracking logic, no landmark smoothing.
# onnx_providers (onnx only): null = CPU (12.6 ms), [CUDAExecutionProvider, CPUExecutionProvider] (3.4 ms),
#   [[TensorrtExecutionProvider, {trt_fp16_enable: true}], CUDAExecutionProvider, CPUExecutionProvider] (2.4 ms; the
#   first start builds and caches the TensorRT engines, ~1 min). Models: scripts/trt/export_onnx.sh -> models/hand_trt/.
mediapipe_engine: "mediapipe"
onnx_providers: null
# onnx only: landmark presence a hand needs to be kept (mediapipe_min_hand_presence_confidence applies to the stock
# engine). Junk detections score ~0.04, real hands 0.96-0.99; at 0.3-0.5 the ONNX engine reports the same hands as
# stock MediaPipe in 98% of frames on human video.
onnx_min_presence: 0.5

# --- dlc backend ---
# HandTrackingVideo1Aug7 shuffle 12: top-down (detector + pose net), 42 keypoints (right_*, then left_*, MP21 order).
batch3d_model_path: '/home/chesteklab/HandTrackingVideo1Aug7-trainset80shuffle12/train'
batch3d_model_snapshot: "snapshot-best-100.pt"
batch3d_detector_snapshot: "snapshot-detector-best-170.pt"   # unset for a bottom-up model
# "pytorch" -> DeepLabCut's inference runners (~26 ms per 2-camera step).
# "onnx"    -> actors/dlc_onnx.py on onnxruntime (~5-7 ms, keypoints within 0.03 px of DLC's). Export first with
#              scripts/trt/export_dlc_onnx.py (-> models/dlc_trt/), for the live frame size dlc_onnx_frame_size.
#              Providers as above; the detector stays on CUDA (its NMS has data-dependent shapes TensorRT can't take).
dlc_engine: "pytorch"
dlc_onnx_frame_size: [960, 720]
dlc_onnx_det_providers: null
dlc_onnx_pose_providers: null

# --- 2D Kalman filter (hand_association: label only; actors/kalmanfilter.py) ---
# One filter per camera. Keypoints below `threshold` are estimated by the filter instead of dropped (likelihood 0).
# Smoother but laggier: raise kalman_measurement_var or lower kalman_process_var.
kalman_enabled: true
kalman_max_coast_frames: 15   # drop a keypoint after this many estimated frames in a row
kalman_nderiv: 1              # 1 = position + velocity (~4 ms per camera); 2 adds acceleration (~12 ms; 2 priors)
kalman_priors: [1]
kalman_initial_var: 10
kalman_process_var: 1
kalman_measurement_var: 10

# ============================================================================
# 3D: calibration, association, smoothing
# ============================================================================
# anipose calibration. Live 2D points are rescaled to each camera's calibrated frame size automatically.
calibration_toml: 'calibration/2026-09-29_124200/calibration.toml'
calibration_camera_names: {6: cam2}   # camera_num -> name in the toml (default "cam{N}"); 09-29 saved camera 6 as cam2
triangulation_min_cameras: 2          # cameras that must see a keypoint (2 is the geometric minimum)

# How hands are matched across cameras:
#   "geometric" (mediapipe): a hand exists in 3D only where cameras agree geometrically (actors/hand_assoc3d.py);
#               tracked frame to frame, right/left from accumulated handedness votes, then One-Euro smoothed.
#   "label":    match by MediaPipe's per-camera handedness label (+ the 2D Kalman filter above).
#   "region"    (dlc): one hand held in a fixed place, see held_hand.
hand_association: geometric
geometric_association:
  tol_px: 12                # reprojection error to join a hand. 8 rejected the hand in 61% of the frames it was lost
                            # although both cameras saw it (2026-10-01, 2 cameras); higher = more coverage, more jumps
  hand_size_mm: [20, 200]   # plausible wrist -> middle MCP length
  gate_mm: 100              # palm movement between frames to stay the same track
  max_miss: 10              # frames a track survives unseen
  # One-Euro filter per keypoint (false = off). min_cutoff (Hz): smoothing at rest; beta: how quickly smoothing
  # relaxes with speed; hold_frames: frames the last hand is repeated when lost; reset_mm: palm jump that restarts it.
  # Measured lag of the smoothed points behind the raw ones: ~50 ms median (2026-09-30 1 DOF run).
  smooth: {min_cutoff: 1.0, beta: 0.05, hold_frames: 5, reset_mm: 60}   # used only with smoothing_3d.method: one_euro
  reject_gloves: {}         # e.g. {teal: [85, 112, 60]}; no measurable effect with geometric association

# Hold-and-glide on the final 3D points (actors/continuity.py), so angles, GUI and UDP never have gaps or steps:
# a keypoint holds its last value through a gap, and after a gap or a jump > jump_mm glides to the new value
# (glide_alpha of the remaining distance per frame, for glide_frames frames: 63% in ~6 frames). Continuously
# measured keypoints pass through. Raw points are still saved (batch3d_points_3d_raw.npy). null = off.
continuity: {glide_frames: 20, glide_alpha: 0.15, jump_mm: 40}   # used only with smoothing_3d.method: one_euro

# Smoothing of the final 3D points (actors/kalman3d.py):
#   kalman    constant-velocity Kalman filter per keypoint, timed from the real step times. ~2 ms lag (the One-Euro +
#             glide chain measured 6-36 ms) for slightly more jitter; a lost keypoint is extrapolated for max_predict_s
#             (velocity decaying with coast_tau_s), then held; when found again, or > reset_mm off, it snaps to the
#             measurement instead of gliding. measurement_sd_mm up / accel_sd_mm_s2 down = smoother and laggier.
#   one_euro  the previous chain: geometric_association.smooth (One-Euro) then continuity (hold and glide).
#   none      raw triangulated points (NaN when the hand is lost).
smoothing_3d:
  method: kalman
  kalman: {measurement_sd_mm: 3, accel_sd_mm_s2: 1000, max_predict_s: 0.2, coast_tau_s: 0.1, reset_mm: 60, hold_s: null}

# hand_association: region (dlc backend): 3D of ONE hand that stays in one place (the stimulated hand an
# experimenter holds), from the two-hand DLC model (actors/held_hand3d.py). Its place is learned during the first
# warmup_s seconds (no output then). Validated 2026-09-16 11:53: MCP angles within 1.1-1.5 deg of the offline analysis.
held_hand:
  likelihood: 0.3        # DLC keypoint likelihood to use a point
  max_px: 15             # a 3D point must reproject within this in every camera
  warmup_s: 10           # seconds to learn the hand's place (before stimulation starts)
  hand: 1                # which of the two hands, numbered left -> right in order_camera's image
  order_camera: 2
  radius_mm: 80          # 3D distance from its place
  radius_px: 40          # 2D distance from its usual image position, every camera
  side: left             # output block (left_* joints)
  smooth: {min_cutoff: 1.0, beta: 0.05, max_gap: 5}

# ============================================================================
# CPU core placement (actors/cpu_affinity.py)
# ============================================================================
# i9-14900K: cpu0-15 are the SMT pairs of 8 P-cores, cpu16-31 are 16 E-cores; the same inference ran 1.72x slower
# on an E-core. ProcessorBatch3D claims the first `compute_slots` P-cores, CameraReaders take the next ones, and
# everything else (savers, GUI, sender, BO) runs on the E-cores. enabled: false lets the scheduler decide.
cpu_affinity:
  enabled: true
  compute_slots: 4          # P-cores for ProcessorBatch3D (mediapipe: 31.7 ms on 4 cores vs 29.2 on 7, 4 cameras)
  avoid_cpus: [12, 13]      # handed out last: they carry the cameras' USB interrupt (scripts/setup_realtime.sh moves it)
  # Never used by any actor: physical core 0 of this CPU is faulty (crashes / wrong results in 22/60 and 11/60 test
  # runs, 2026-09-25). fes-run.sh launches everything off it too.
  exclude_cpus: [0, 1]
  overrides: {}             # per-actor CPU lists keyed by log label, e.g. {"Processor cam3": [14, 15]}

# ============================================================================
# Closed-loop stimulation: Bayesian optimisation (actors/bayes_opt.py, actors/brand_link.py)
# ============================================================================
# SenderUDP sends stim requests to SENDER_UDP_IP:stim_port; BRAND answers (stim_on / stim_off / stim_rejected /
# target) to this machine's feedback_port. Env SENDER_STIM_PORT / BRAND_FEEDBACK_PORT override.
brand_link:
  stim_port: 11116
  feedback_port: 11117

bayes_opt:
  # Joints the GPs model and the target is scored on (the processor's joint names; region mode = left_*).
  joints: [left_INDEX_MCP, left_MIDDLE_MCP, left_RING_MCP, left_PINKY_MCP]
  # Analysed runs whose stim_joint_response.csv seed the GPs (joint columns get prior_joint_prefix). [] = from scratch.
  prior_runs:
    - analysis/stim_1153/walkthrough_out_0909_1352
    - analysis/stim_1153/walkthrough_out
    - analysis/stim_1153/walkthrough_out_1203
    - analysis/stim_1153/walkthrough_out_1218
  prior_joint_prefix: left_
  refit_every: 10            # trials between hyper-parameter refits (background thread)
  space:                     # candidates = every electrode set x pulse width x frequency x current below
    electrodes: [2, 4, 6, 8, 10, 12, 14, 16]
    pulse_widths: [80, 100, 120, 160, 200]     # us (40 is rejected by the CereStim)
    frequencies: [20, 30, 50, 100]             # Hz (10 rejected); 100 Hz x 1.5 s = 150 pulses (limit 255)
    currents: [1000, 2000, 3000, 4000, 5000]   # uA
    max_electrodes: 8
  timing:                    # s; same windows as the stim analysis (response from on + settle to off, minus baseline)
    stim_duration: 1.5
    rest_duration: 2.5
    settle: 0.5
    baseline: 1.0
    on_timeout: 1.0          # no stim_on this long after the request -> trial abandoned
    off_grace: 0.5           # no stim_off this long after on + duration -> assume the nominal off time
    eval_timeout: 1.0        # evaluate even if frames past stim_off have not arrived by then
  acquisition:
    mode: target             # target = reach BRAND's current target posture; explore = most informative candidate
    kappa: 1.0               # exploration weight (lower confidence bound on the squared error)
  # BRAND's {"fingers": {finger: 0..1}} target -> joint angles (0 = straight, 1 = flexed). PLACEHOLDER angles:
  # set them to the virtual hand's range.
  finger_map:
    index:  {joints: [left_INDEX_MCP],  straight: 0, flexed: 90}
    middle: {joints: [left_MIDDLE_MCP], straight: 0, flexed: 90}
    ring:   {joints: [left_RING_MCP],   straight: 0, flexed: 90}
    pinky:  {joints: [left_PINKY_MCP],  straight: 0, flexed: 90}
  max_trials: 0              # 0 = until stopped
