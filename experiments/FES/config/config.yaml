# ============================================================================
# General
# ============================================================================
fps: 30
output_path: '/home/chesteklab/predictions'
alpha: 0.5

# Scale factor between native camera resolution and the frame the model sees
# (960x540 / 1920x1080 = 0.5). Used by processor.py to cv2.resize (only when
# camera_prescaled is false) and, always, to un-scale predicted angles back to
# the space the sender's normalize_to_range() constants were calibrated in.
# Keep at 0.5 even with camera_prescaled: true.
resize: 0.5
# TIS downscales to stream_resolution in GStreamer, so processor.py must NOT
# resize again. Set false if Generator0 is the synthetic actors.generator.Generator
# (puts native-resolution frames).
camera_prescaled: True

# Number of preds{N}_in slots SenderUDP polls each step. Independent of how many
# cameras a yaml wires in (unwired slots are skipped cheaply). Raise if a yaml
# wires more than 4 Processor actors to the Sender.
max_camera_slots: 4

