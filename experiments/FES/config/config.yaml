# ============================================================================
# DLC per-camera models (actors/processor.py)
# ============================================================================
model_path_0: '/home/chesteklab/Desktop/rhodesEMG1DOF-jake-2026-09-21/dlc-models-pytorch/iteration-0/rhodesEMG1DOFSep21-trainset95shuffle2/train'
model_snapshot_0: "snapshot-best-010.pt"
model_path_1: '/home/chesteklab/Downloads/all_videos_side_viewFeb8-trainset95shuffle5/train'
model_snapshot_1: "snapshot-best-010.pt"
model_path_2: '/home/chesteklab/Desktop/rhodesEMG1DOF-jake-2026-09-21/dlc-models-pytorch/iteration-0/rhodesEMG1DOFSep21-trainset95shuffle2/train'
model_snapshot_2: "snapshot-best-010.pt"
# Confidence below which the GUI draws a keypoint hollow/orange instead of
# solid red. Does not hide keypoints.
threshold: 0.3   # THE confidence threshold. geometric association: MediaPipe hands scoring below it are ignored. label association: below it a keypoint is Kalman-estimated (hollow red circle); at/above, measured (solid)
# Swap the model's PartAffinityFieldPredictor for HeatmapPredictor at load time.
# Models are trained with num_animals=1, so PAF grouping is meaningless and its
# assembly step blanks keypoints to NaN/-1. Heatmap argmax returns every
# keypoint (100% vs PAF's 60.8% finite; median 1.5 px disagreement where PAF is
# confident). Set false to restore PAF.
single_animal_predictor: true

# ============================================================================
# ProcessorBatch3D (actors/processor_batch3d.py)
# ============================================================================
# Both backends give the same 21-keypoint MediaPipe hand layout (WRIST,
# THUMB_CMC..PINKY_TIP), so nothing downstream cares which is active.
#   "mediapipe" -- Google HandLandmarker. Far more reliable on this rig than the
#     DLC model (handedness confidence 0.97-1.0 vs DLC median keypoint
#     likelihood ~0.25). One HandLandmarker per camera on a thread pool (TFLite
#     releases the GIL): 32.6 ms for 4 cameras vs 138 ms sequential.
#   "dlc" -- humanWristMP21 fine-tune, one batched PyTorch pass (41.6 ms for 4
#     frames vs 75.6 sequential). Fallback / comparison only.
batch3d_backend: "mediapipe"

# --- mediapipe backend ---
mediapipe_model_path: '/home/chesteklab/Desktop/hand-tracking-notebooks-jake-2026-08-17/mediapipe/hand_landmarker.task'
mediapipe_num_hands: 2   # 4 = most reliable live 3D (19.9 steps/s, 48 ms, cover 24%, boneCV 0.26). 1 = full 30 fps (27 ms) but with one slot MediaPipe latches onto different hands run to run (boneCV 0.18 vs 0.31 on two replays). See scripts/tune3d/tracking_3d_walkthrough.ipynb
# Track both hands: 42 keypoints (right_* then left_*) instead of only the first.
# MediaPipe assumes a mirrored image, so on raw frames its "Left" is the
# subject's right hand -- flip with mediapipe_swap_handedness if names matter.
# The label is a per-camera guess and can disagree between views.
mediapipe_both_hands: true
mediapipe_swap_handedness: false
# HandLandmarker's own gate on reporting a hand at all (distinct from
# `threshold` at the top).
mediapipe_min_hand_detection_confidence: 0.02
mediapipe_min_hand_presence_confidence: 0.02
mediapipe_min_tracking_confidence: 0.02
# "video" tracks a found hand between frames (far less dropout than "image",
# which re-detects from scratch every frame).
mediapipe_running_mode: "video"
# CPU measured as fast as GPU here and more consistent; leave on CPU.
mediapipe_delegate: "CPU"   # GPU measured 2x slower (71 vs 32.5 ms/step, 4 cams, 09-25)

# --- dlc backend (batch3d_backend: "dlc") ---
# HandTrackingVideo1Aug7 shuffle 12: TOP-DOWN (method: td), 42 keypoints (right
# hand then left, MP21 order, lowercase right_/left_ names). Top-down needs the
# detector snapshot; leave batch3d_detector_snapshot unset for a bottom-up model.
batch3d_model_path: '/home/chesteklab/HandTrackingVideo1Aug7-trainset80shuffle12/train'   # needs DeepLabCut 3.0.2: env improvDLC3
batch3d_model_snapshot: "snapshot-best-100.pt"
batch3d_detector_snapshot: "snapshot-detector-best-170.pt"

# --- Kalman smoothing of the 2D keypoints (actors/kalmanfilter.py) ---
# One DLC KalmanFilterPredictor per camera. A keypoint whose likelihood is below
# `threshold` (or missing) is ESTIMATED by the filter instead of dropped, so
# 2D, 3D and joint angles stay continuous. Estimated keypoints carry likelihood 0. Tuning: raise kalman_measurement_var / lower process_var for
# smoother-but-laggier; raise `threshold` to trust MediaPipe less.
kalman_enabled: true   # label association only; geometric smooths in 3D
kalman_max_coast_frames: 15   # give up (drop the keypoint) after this many estimated frames
# 1 = position+velocity (~4 ms/camera); 2 adds acceleration (~12 ms/camera, priors needs 2 entries)
kalman_nderiv: 1
kalman_priors: [1]
kalman_initial_var: 10
kalman_process_var: 1
kalman_measurement_var: 10

# ============================================================================
# 3D triangulation
# ============================================================================
# anipose calibration from 2026-09-25 12:49 (cams 0, 1, 2, 3, 5 at 0.42 px; 4 and 6
# uncalibrated, so they contribute no rays). Cams 1 and 5 were moved when the chair
# came in afterwards: recalibrate for the new layout. Graphs can override this per run
# (ProcessorBatch3D config_overrides). Relative paths resolve against experiments/FES/.
calibration_toml: 'calibration/2026-09-25_124900/calibration.toml'
# camera_num -> camera name inside calibration_toml. Defaults to "cam{N}".
calibration_camera_names: {}
# Live 2D points are rescaled into each camera's calibrated frame size (from the toml)
# automatically. Keypoints below `threshold` are dropped before triangulation (with
# mediapipe that is the per-hand handedness score, 0.97-1.0 for real detections).
# Minimum cameras that must retain a keypoint. 2 is the geometric minimum.
triangulation_min_cameras: 2

# --- Cross-camera hand association (actors/hand_assoc3d.py) ---
# "geometric": a hand exists in 3D only where cameras agree geometrically; tracked
# frame to frame, right/left from accumulated handedness votes, One-Euro smoothed.
# "label": old behaviour (match by MediaPipe's per-camera handedness label).
# Tuned 2026-09-25 on 130900 (cams 0,1,3,5) with scripts/tune3d -- see RESULTS.md there.
hand_association: geometric
geometric_association:
  tol_px: 8                 # reprojection tolerance to join a hand; 10-12 = more coverage, 3-5x the jumps
  hand_size_mm: [20, 200]   # wrist -> middle MCP plausibility
  gate_mm: 100              # frame-to-frame palm distance to stay the same track
  max_miss: 10              # frames a track survives unseen
  smooth: {min_cutoff: 1.0, beta: 0.05, hold_frames: 5, reset_mm: 60}   # One-Euro; ~20 ms delay. false = off
  reject_gloves: {}         # e.g. {teal: [85, 112, 60]}; no measurable effect with geometric association

# Continuous output (actors/continuity.py): every keypoint holds its last value through a gap and glides
# back (~glide_frames, glide_alpha per frame) when re-found or after a jump > jump_mm, so angles, GUI and
# the UDP stream have no gaps or steps. Causal. Raw points are still saved (batch3d_points_3d_raw.npy).
# Remove the block (or set to null) to output raw.
continuity: {glide_frames: 20, glide_alpha: 0.15, jump_mm: 40}   # ~0.7 s glide

# "region" (dlc backend): 3D of ONE hand that stays in one place -- the stimulated hand an experimenter
# holds -- from the two-hand DLC model (actors/held_hand3d.py). Its place is learned during the first
# warmup_s seconds (no output then) and fixed. Validated on 2026-09-16 11:53: MCP angles within
# 1.1-1.5 deg of the offline analysis, 17.8 ms/step (analysis/stim_1153/stim_analysis_walkthrough.ipynb).
held_hand:
  likelihood: 0.3        # DLC keypoint likelihood to use a point
  max_px: 15             # 3D point must reproject within this in every camera
  warmup_s: 10           # learn the hand's place in this many seconds (before stimulation starts)
  hand: 1                # which of the two hands: numbered left -> right in order_camera's image
  order_camera: 2
  radius_mm: 80          # 3D distance from its place
  radius_px: 40          # 2D distance from its usual image position, every camera
  side: left             # output block (left_* joints)
  smooth: {min_cutoff: 1.0, beta: 0.05, max_gap: 5}

# ============================================================================
# CPU core placement (actors/cpu_affinity.py)
# ============================================================================
# Hybrid CPU: cpu0-15 are SMT pairs of 8 P-cores, cpu16-31 are 16 E-cores. The
# same inference measured 6.3-6.6 ms on a P-core vs 11.4-12.0 ms on an E-core
# (1.72x), which showed up as a 1.79x per-camera spread in run 20260804-1432.
# Placement (core 0 excluded, so 7 physical P-cores): ProcessorBatch3D claims the
# first `compute_slots` P-cores ([8,9] [10,11] [2,3] [4,5]); CameraReaders take the
# next ones in camera_num order ([6,7] [14,15] [12,13]) and any beyond that go to the
# E-cores with the VideoSavers, GUI, sender and BO actors. Set enabled: false to let
# the scheduler decide.
cpu_affinity:
  enabled: true
  # Physical P-cores for the processor(s) before CameraReaders claim any. ProcessorBatch3D
  # (mediapipe) uses this many (4 cameras: 31.7 ms/step on 4 cores vs 29.2 on 7).
  compute_slots: 4
  # Cores handed out last. cpu12/13 carry the xhci USB interrupt for the cameras
  # (IRQ 132); scripts/setup_realtime.sh moves it to cpu31.
  avoid_cpus: [12, 13]
  # Never used, by any actor. Physical core 0 (cpu0/cpu1) of this i9-14900K is
  # faulty: 22/60 and 11/60 runs of a fixed numpy computation crashed or gave
  # wrong results on cpu0/cpu1 vs 0/60 on other cores (tested 2026-09-25) --
  # the Raptor Lake degradation. It caused the random import errors and likely
  # the ProcessorBatch3D freeze. fes-run.sh also launches everything off these.
  exclude_cpus: [0, 1]
  # Per-actor override keyed by the log label, e.g. {"Processor cam3": [14, 15]}
  overrides: {}

# ============================================================================
# Closed-loop stimulation: Bayesian optimisation (actors/bayes_opt.py, actors/brand_link.py)
# ============================================================================
# Ports on top of the joint-angle stream (SENDER_UDP_IP:SENDER_UDP_PORT, unchanged). SenderUDP sends stim
# requests to SENDER_UDP_IP:stim_port; BRAND answers (stim_on/stim_off/stim_rejected/target) to this
# machine's feedback_port. Env SENDER_STIM_PORT / BRAND_FEEDBACK_PORT override. Protocol: actors/brand_link.py.
brand_link:
  stim_port: 11116
  feedback_port: 11117

bayes_opt:
  # Joints the GPs model and the target is scored on: the processor's joint names (region mode = left_*).
  joints: [left_INDEX_MCP, left_MIDDLE_MCP, left_RING_MCP, left_PINKY_MCP]
  # Analysed runs whose stim_joint_response.csv seed the GPs (joint columns get prior_joint_prefix). [] = from scratch.
  prior_runs:
    - analysis/stim_1153/walkthrough_out_0909_1352
    - analysis/stim_1153/walkthrough_out
    - analysis/stim_1153/walkthrough_out_1203
    - analysis/stim_1153/walkthrough_out_1218
  prior_joint_prefix: left_
  refit_every: 10            # trials between hyper-parameter refits (background thread)
  space:                     # candidates = every electrode set x pulse width x frequency x current below
    electrodes: [2, 4, 6, 8, 10, 12, 14, 16]
    pulse_widths: [80, 100, 120, 160, 200]     # us (40 rejected by the CereStim)
    frequencies: [20, 30, 50, 100]             # Hz (10 rejected); 100 Hz x 1.5 s = 150 pulses (limit 255)
    currents: [1000, 2000, 3000, 4000, 5000]   # uA
    max_electrodes: 8
  timing:                    # s; same windows as the stim analysis (response from on + settle to off, minus baseline)
    stim_duration: 1.5
    rest_duration: 2.5
    settle: 0.5
    baseline: 1.0
    on_timeout: 1.0          # no stim_on this long after the request -> trial abandoned
    off_grace: 0.5           # no stim_off this long after on + duration -> assume the nominal off time
    eval_timeout: 1.0        # evaluate even if frames past stim_off have not arrived by then
  acquisition:
    mode: target             # target = reach BRAND's current target posture; explore = most informative
    kappa: 1.0               # exploration weight (lower confidence bound on the squared error)
  # BRAND's {"fingers": {finger: 0..1}} target -> joint angles (0 = straight, 1 = flexed). PLACEHOLDER angles:
  # set them to the virtual hand's range.
  finger_map:
    index:  {joints: [left_INDEX_MCP],  straight: 0, flexed: 90}
    middle: {joints: [left_MIDDLE_MCP], straight: 0, flexed: 90}
    ring:   {joints: [left_RING_MCP],   straight: 0, flexed: 90}
    pinky:  {joints: [left_PINKY_MCP],  straight: 0, flexed: 90}
  max_trials: 0              # 0 = until stopped
