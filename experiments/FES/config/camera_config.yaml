camera_params:
  resolution:
    width: 1920 #1280   640
    height: 1080 #720   480
  # Frames are captured at `resolution` (native sensor format) but downscaled
  # by GStreamer's videoscale element before they ever reach numpy/the object
  # store/the model — cuts the JPEG-round-trip + cv2.resize cost that used to
  # run on the full 1080p frame. Consumers that read frames back out of the
  # store (Processor, VideoSaver, VideoScreen) should size against this, not
  # `resolution` above.
  # stream_resolution:
    width: 960
    height: 540
  fps: "30/1"
  # Start each free-running camera one Nth of a frame period after the last, so
  # their inference requests reach the GPU spread out instead of bunched. In
  # 20260804-1432 three of four cameras submitted within 4.2 ms of each other
  # and all four blocked until the GPU drained the pile; the earliest submitter
  # measured 22.13 ms of "inference" for 5.4 ms of actual GPU work.
  # corr(submission phase, measured inference time) was -0.999.
  #
  # `slots` is how many phase slots to divide the period into; defaults to
  # config.yaml's max_camera_slots. Over-estimating is harmless (the slots are
  # just narrower than they need to be), under-estimating re-creates the
  # collision.
  #
  # Turn this OFF once the cameras are hardware-triggered: sync and stagger are
  # opposite goals, and triangulation needs sync. See MULTICAM_3D_PLAN.md.
  # appsink queue depth per camera. 5 = a briefly stalled reader loses no frame (use
  # this when RECORDING: the saver shares these frames). 1 = only the newest frame is
  # ever delivered, so every camera has the same latency (use this for LIVE tracking).
  appsink_max_buffers: 5

  # Camera controls applied to every camera once its pipeline is PLAYING (tcam property
  # names -> values, in this order; put each *Auto before its manual value). Left on the
  # cameras' own auto modes the exposure drifts with the scene: in dim light it pegs at
  # one frame period and the frame rate sags (cam0 ran 29.53 fps, front_right 29.72),
  # and brightness/colour differ from camera to camera. Exposure must stay under one
  # frame period (33333 us at 30 fps).
  # TUNE ExposureTime/Gain under the real experiment lighting: watch the GUI and
  # aim for a bright hand without saturated pixels. Shorter exposure = less motion
  # blur but a darker image (compensate with Gain). Remove the block (or set it to
  # {}) to leave the cameras untouched. A per-camera `settings:` mapping under an
  # active_cameras entry overrides these.
  camera_settings:
    ExposureAuto: "Off"
    ExposureTime: 10000
    GainAuto: "Off"
    Gain: 15.0
    BalanceWhiteAuto: "Off"

  capture_stagger:
    enabled: false
    slots: 4
    lead_seconds: 2.0
