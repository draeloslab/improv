# Thresholds for scripts/resource_guard.py (the run's out-of-memory / out-of-disk guard).
#
# Why it exists: nothing else stops a run from exhausting RAM or disk. The Redis store is allowed 600 GB
# (improv/nexus.py store_size) on a 125 GB machine, VideoSaver's write queue is unbounded, and when the disk
# fills the saver's writer thread dies with one log line while frames carry on being produced and dropped.
# The camera appsinks also drop frames by design (drop=True). So a run that is starving looks fine until
# the files are short or the kernel OOM-killer picks something at random. The guard stops the run cleanly
# (stop -> let actors flush -> quit) while there is still room to write the .npy files.

# --- live watchdog -----------------------------------------------------------------------------------------
ram_floor_gb: 6        # stop the run when available RAM (MemAvailable) falls below this
disk_floor_gb: 15      # ... or free space on a watched disk does (7 cameras at 60 fps write ~0.9 GB/s: ~17 s of margin)
lead_s: 30             # ... or when the current trend reaches a floor in less than this many seconds
window_s: 10           # trend = change over this trailing window
poll_s: 0.5
warn_ram_gb: 15        # print a status line (and nothing else) while RAM is below this
warn_disk_gb: 60       # same for disk

# --- preflight estimate ------------------------------------------------------------------------------------
# RAM = store window (IMPROV_STORE_TTL_S x cameras x fps x frame bytes x overhead) + baseline.
# baseline_ram_gb is everything else the run holds at steady state (python workers, DLC/TensorRT models, CUDA
# host buffers, the GUI). It is a rough figure: raise it if the preflight keeps saying "fine" and runs still starve.
baseline_ram_gb: 16
store_overhead: 1.15   # Redis + pickle bookkeeping on top of the raw frame bytes
default_minutes: 30    # planned length when fes-run is not given --minutes
