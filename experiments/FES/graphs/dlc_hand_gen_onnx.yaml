# TEST: the ONNX DLC engine (actors/dlc_onnx.py) on recorded video. Same as dlc_hand_gen.yaml except dlc_engine /
# dlc_onnx_* below. Needs models/dlc_trt/dlc_detector_960x540.onnx: python scripts/trt/export_dlc_onnx.py --frame-size 960 540
#
#   Generator{slot} -> ProcessorBatch3D (backend dlc, hand_association region) -> VideoScreen3D
#
# 2026-09-16 11:53 FES run (War Machine), cams 1 and 2 (the two that see the held hand; frame numbers
# match between them). Calibration: 09-11 112900 with cam1's small rotation corrected
# (analysis/stim_1153/stim_analysis_walkthrough.ipynb step 3). The hand's place is learned in the first
# 10 s, then the left_* joint angles are the stimulated hand.
#
# Run: FES_CONDA_ENV=improvDLC3 fes-run dlc_hand_gen_onnx.yaml

actors:
  GUI:
    package: actors.video_screen_3d
    class: Visual3D
    visual: VideoScreen3D

  VideoScreen3D:
    package: actors.video_screen_3d
    class: VideoScreen3D
    num_active_cameras: 4

  Generator0: {package: actors.camera_reader, class: CameraReader, camera_num: 0}
  Generator1: {package: actors.camera_reader, class: CameraReader, camera_num: 3}
  Generator2: {package: actors.camera_reader, class: CameraReader, camera_num: 5}
  Generator3: {package: actors.camera_reader, class: CameraReader, camera_num: 6}


  ProcessorBatch3D:
    package: actors.processor_batch3d
    class: ProcessorBatch3D
    num_cameras: 4
    camera_nums: [0, 3, 5, 6]
    pred_active: True
    triangulate: true
    config_overrides:
      batch3d_backend: dlc
      hand_association: region
      dlc_engine: onnx
      dlc_onnx_frame_size: [960, 540]
      dlc_onnx_pose_providers: [CUDAExecutionProvider, CPUExecutionProvider]   # TensorRT saves ~0.5 ms but logs a harmless parse error
    method: spawn

  SenderUDP:
    package: actors.sender_udp
    class: SenderUDP
    method: spawn

connections:
  Generator0.q_out: [VideoScreen3D.images0_in, ProcessorBatch3D.frames0_in]
  Generator1.q_out: [VideoScreen3D.images1_in, ProcessorBatch3D.frames1_in]
  Generator2.q_out: [VideoScreen3D.images2_in, ProcessorBatch3D.frames2_in]
  Generator3.q_out: [VideoScreen3D.images3_in, ProcessorBatch3D.frames3_in]
  ProcessorBatch3D.q_out: [SenderUDP.joints_in, VideoScreen3D.preds_in]

redis_config:
  port: 6379
