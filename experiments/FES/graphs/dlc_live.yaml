# DLC two-hand model (detector + pose net, 42 keypoints) on live cameras -> triangulate -> joint angles over UDP.
#
#   Generator{slot} -+-> ProcessorBatch3D --+-> SenderUDP.joints_in --UDP :11115 joint angles (BRAND vision node)
#   (CameraReader)     |                      +-> VideoScreen3D.preds_in
#                      +-> VideoScreen3D.images{slot}_in
#                      +-> VideoSaver{slot}.q_in      (only with save_video)
#
# MASTER GRAPH: the `fes:` block picks the cameras and whether raw video is saved; scripts/fes_graph.py (called by
# fes-run) adds the Generator / VideoSaver actors and every connection, and sets num_cameras / camera_nums /
# num_active_cameras. Change them here or per run:
#     fes-run dlc_live.yaml --cameras 0,3,5,6 --save-video
# Slot order = the order listed; the calibration toml (config.yaml calibration_toml) must contain every camera.
# Engine (ONNX/TensorRT vs stock) is a config.yaml / config_overrides key, not a separate graph.
#
# Run: SENDER_UDP_IP=<brand ip> FES_CONDA_ENV=improvDLC3 fes-run dlc_live.yaml
# hand_association: geometric -- each camera's right_*/left_* blocks are candidate hands, keypoints below
# config.yaml `threshold` are dropped, and a hand exists in 3D only where cameras agree; the triangulation weights
# each view by its DLC likelihood. "region" is the held-hand tracker of the 2026-09-16 stimulation runs (learns the
# hand's place in the first 10 s, left_* block only) -- needs that day's calibration and videos.
# dlc_onnx_frame_size must match the live frames (models/dlc_trt/dlc_detector_960x720.onnx; config.yaml default).

fes:
  source: live
  cameras: [0, 1, 2, 3, 4, 5, 6]
  save_video: false

actors:
  GUI: {package: actors.video_screen_3d, class: Visual3D, visual: VideoScreen3D}
  VideoScreen3D: {package: actors.video_screen_3d, class: VideoScreen3D}
 
  ProcessorBatch3D:
    package: actors.processor_batch3d
    class: ProcessorBatch3D
    pred_active: false
    triangulate: false
    # align_frames is replay-only: on live cameras it stalls every step on the slowest one
    compute_cores: 7
    config_overrides:
      batch3d_backend: dlc
      dlc_engine: rtmpose_onnx
      dlc_onnx_frame_size: [960, 720]      # must match the videos (the detector is exported per frame size)
      dlc_onnx_det_providers: [CUDAExecutionProvider, CPUExecutionProvider]     # NMS inside: no TensorRT
      dlc_onnx_pose_providers: [CUDAExecutionProvider, CPUExecutionProvider]
      dlc_rtmpose_det_score: 0.3
      dlc_rtmpose_max_hands: 2
      hand_association: geometric
      triangulation_method: dlt                     # equal-weight DLT: the likelihood-weighted one gave 2.7x more joint-angle jitter and no better held-out accuracy (2026-10-15)
      calibration_toml: 'calibration/2026-10-13_131500/calibration.toml'
    method: spawn


  SenderUDP:
    package: actors.sender_udp
    class: SenderUDP
    send_frame_num: true      # true: camera frame number with every packet (needs the rebuilt BRAND vision node)
    method: spawn
    port: 11115

connections:
  ProcessorBatch3D.q_out: [SenderUDP.joints_in, VideoScreen3D.preds_in]

redis_config:
  port: 6379
