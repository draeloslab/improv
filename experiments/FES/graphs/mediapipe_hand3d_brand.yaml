# Human hand tracking (MediaPipe, 3 cameras, triangulated) -> 21 3D keypoints to BRAND's hand3d node,
# which drives a virtual hand with the same 21 keypoints for the hand3d_task (1-5 fingertip targets up
# to full 27-DOF poses). BRAND side: ~/brand-monkeyrig graphs/generic/hand3d_task.yaml.
#
#   CameraReader{slot} ─┬─> ProcessorBatch3D ─┬─> SenderUDP.joints_in ──UDP :11115 joint angles (vision node)
#                       │                     │                        └─UDP :11118 21 keypoints (hand3d node)
#                       │                     └─> VideoScreen3D.preds_in
#                       ├─> VideoScreen3D.images{slot}_in
#                       └─> VideoSaver{slot}.q_in
#
# Geometric association always fills the 42-keypoint two-hand layout (right rows 0-20, left 21-41), so
# SenderUDP picks one hand for BRAND: keypoint_hand auto = whichever block has more keypoints this step
# (set right/left to pin it when a second person's hand is in view).
#
# Cameras: physical 0, 6, 3 are calibrated by 2026-09-29_124200. That recording (7cam_test) saved physical
# cam 6 as "cam2", so config.yaml maps calibration_camera_names {6: cam2}. Add
# cameras by adding a Generator/VideoSaver pair, its camera_num to camera_nums and the calibration.
#
# Run: SENDER_UDP_IP=<brand ip> fes-run.sh mediapipe_hand3d_brand.yaml   (env improvPytorchJarvis)

actors:
  GUI:
    package: actors.video_screen_3d
    class: Visual3D
    visual: VideoScreen3D

  VideoScreen3D:
    package: actors.video_screen_3d
    class: VideoScreen3D
    num_active_cameras: 3

  Generator0: {package: actors.camera_reader, class: CameraReader, camera_num: 0}
  Generator1: {package: actors.camera_reader, class: CameraReader, camera_num: 6}
  Generator2: {package: actors.camera_reader, class: CameraReader, camera_num: 3}

  

  ProcessorBatch3D:
    package: actors.processor_batch3d
    class: ProcessorBatch3D
    num_cameras: 3
    camera_nums: [0, 6, 3]
    pred_active: True
    triangulate: true
    config_overrides:
      batch3d_backend: mediapipe
      hand_association: geometric
      mediapipe_both_hands: true
      mediapipe_num_hands: 2
    method: spawn

  SenderUDP:
    package: actors.sender_udp
    class: SenderUDP
    keypoint_port: 11118
    keypoint_hand: auto
    method: spawn

  # VideoSaver0: {package: actors.video_saver, class: VideoSaver, camera_num: 0, method: spawn}
  # VideoSaver1: {package: actors.video_saver, class: VideoSaver, camera_num: 6, method: spawn}
  # VideoSaver2: {package: actors.video_saver, class: VideoSaver, camera_num: 3, method: spawn}

connections:
  Generator0.q_out: [VideoScreen3D.images0_in, ProcessorBatch3D.frames0_in]
  Generator1.q_out: [VideoScreen3D.images1_in, ProcessorBatch3D.frames1_i]
  Generator2.q_out: [VideoScreen3D.images2_in, ProcessorBatch3D.frames2_in]
  ProcessorBatch3D.q_out: [SenderUDP.joints_in, VideoScreen3D.preds_in]

redis_config:
  port: 6379
