# MediaPipe hand tracking + triangulation on four live cameras, with each
# camera's raw stream also saved to disk.
#
#   CameraReader{slot} ─┬─> ProcessorBatch3D ──> VideoScreen3D.preds_in
#                       ├─> VideoScreen3D.images{slot}_in
#                       └─> VideoSaver{slot}.q_in
#
# Triangulation uses config.yaml's calibration_toml (2026-09-23/124500), which
# covers cams 3,4,5,6 only; cam 0 gets 2D keypoints but no rays.
#
# Run: fes-run.sh "mediapipe_gen copy.yaml"   (env: FES_CONDA_ENV=improvPytorchJarvis)

actors:
  GUI:
    package: actors.video_screen_3d
    class: Visual3D
    visual: VideoScreen3D

  VideoScreen3D:
    package: actors.video_screen_3d
    class: VideoScreen3D
    num_active_cameras: 5

  Generator0:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 0

  Generator1:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 3

  Generator2:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 4

  Generator3:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 6

  Generator4:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 6

  # Slots (Generator{i} -> frames{i}_in / images{i}_in) must be 0..N-1 in
  # order; camera_nums maps each slot to its physical camera. Keep it in sync
  # with the Generator and VideoSaver camera_nums.
  ProcessorBatch3D:
    package: actors.processor_batch3d
    class: ProcessorBatch3D
    num_cameras: 5
    camera_nums: [0, 3, 4, 6]
    pred_active: True
    triangulate: true
    method: spawn

  VideoSaver0:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 0
    method: spawn

  VideoSaver1:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 3
    method: spawn

  VideoSaver2:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 4
    method: spawn

  VideoSaver3:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 6
    method: spawn

  VideoSaver4:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 6
    method: spawn
    
connections:
  Generator0.q_out: [VideoScreen3D.images0_in, ProcessorBatch3D.frames0_in, VideoSaver0.q_in]
  Generator1.q_out: [VideoScreen3D.images1_in, ProcessorBatch3D.frames1_in, VideoSaver1.q_in]
  Generator2.q_out: [VideoScreen3D.images2_in, ProcessorBatch3D.frames2_in, VideoSaver2.q_in]
  Generator3.q_out: [VideoScreen3D.images3_in, ProcessorBatch3D.frames3_in, VideoSaver3.q_in]
  Generator4.q_out: [VideoScreen3D.images4_in, ProcessorBatch3D.frames4_in, VideoSaver4.q_in]

  ProcessorBatch3D.q_out: [VideoScreen3D.preds_in]

redis_config:
  port: 6379
