# TEST: the ONNX/TensorRT MediaPipe engine on the two live cameras, GUI + raw video (no BRAND). For checking the
# tracker and its timing on the rig before running mediapipe_hand3d_brand_onnx.yaml. The raw video lets the same
# human-hand frames be replayed offline through both engines (stock MediaPipe vs ONNX): record ~1-2 min, both hands.
#
#   CameraReader{slot} -+-> ProcessorBatch3D --> VideoScreen3D.preds_in
#                       +-> VideoScreen3D.images{slot}_in
#                       +-> VideoSaver{slot}.q_in
#
# Cameras: slots 0-3 = physical 0, 3, 5, 6 (top, front_right, bottom_right, back_right), the four cameras the
# 2026-10-02_160800 calibration solved (config.yaml calibration_toml). To change the set: one Generator per camera,
# camera_nums in slot order, num_cameras / num_active_cameras, and a frames{slot}_in / images{slot}_in connection per
# slot -- the processor silently ignores a misspelled input name.
#
# Run: FES_CONDA_ENV=improvDLC3 fes-run mediapipe_live_onnx.yaml

actors:
  GUI:
    package: actors.video_screen_3d
    class: Visual3D
    visual: VideoScreen3D

  VideoScreen3D:
    package: actors.video_screen_3d
    class: VideoScreen3D
    num_active_cameras: 4

  Generator0: {package: actors.camera_reader, class: CameraReader, camera_num: 0}
  Generator1: {package: actors.camera_reader, class: CameraReader, camera_num: 3}
  Generator2: {package: actors.camera_reader, class: CameraReader, camera_num: 5}
  Generator3: {package: actors.camera_reader, class: CameraReader, camera_num: 6}

  ProcessorBatch3D:
    package: actors.processor_batch3d
    class: ProcessorBatch3D
    num_cameras: 4
    camera_nums: [0, 3, 5, 6]
    pred_active: True
    triangulate: true
    config_overrides:
      batch3d_backend: mediapipe
      hand_association: geometric
      mediapipe_both_hands: true
      mediapipe_num_hands: 2
      mediapipe_engine: onnx
      onnx_providers: [[TensorrtExecutionProvider, {trt_fp16_enable: true}], CUDAExecutionProvider, CPUExecutionProvider]
    method: spawn

  VideoSaver0: {package: actors.video_saver, class: VideoSaver, camera_num: 0, method: spawn}
  VideoSaver1: {package: actors.video_saver, class: VideoSaver, camera_num: 3, method: spawn}
  VideoSaver2: {package: actors.video_saver, class: VideoSaver, camera_num: 5, method: spawn}
  VideoSaver3: {package: actors.video_saver, class: VideoSaver, camera_num: 6, method: spawn}

connections:
  Generator0.q_out: [VideoScreen3D.images0_in, ProcessorBatch3D.frames0_in, VideoSaver0.q_in]
  Generator1.q_out: [VideoScreen3D.images1_in, ProcessorBatch3D.frames1_in, VideoSaver1.q_in]
  Generator2.q_out: [VideoScreen3D.images2_in, ProcessorBatch3D.frames2_in, VideoSaver2.q_in]
  Generator3.q_out: [VideoScreen3D.images3_in, ProcessorBatch3D.frames3_in, VideoSaver3.q_in]
  ProcessorBatch3D.q_out: [VideoScreen3D.preds_in]

redis_config:
  port: 6379
