# DLC two-hand model + triangulation on a recorded session (no cameras).
#
#   Generator{slot} -+-> ProcessorBatch3D --> SenderUDP.joints_in, VideoScreen3D.preds_in
#                      +-> VideoScreen3D.images{slot}_in
#
# MASTER GRAPH (see mediapipe_live.yaml): `fes:` picks the cameras; scripts/fes_graph.py adds one Generator per
# camera and the connections. Replay never saves video. `cameras` picks camera_video_<N>_*.mp4 from the session
# (`session` = 'YYYY-MM-DD/HHMMSS' under ~/camera_video, applied to every Generator via fes.generator); add
# `subfolder: raw` to play the session's raw/ copies instead.  fes-run dlc_hand_gen.yaml --cameras 0,3,6
#
# hand_association: geometric -- each camera's right_*/left_* blocks are candidate hands, keypoints below
# config.yaml `threshold` are dropped, and a hand exists in 3D only where cameras agree. "region" is the held-hand
# tracker (learns the hand's place in the first 10 s, left_* block only).
#
# Run: fes-run dlc_hand_gen.yaml

fes:
  source: replay
  cameras: [0, 1, 3, 6]
  generator: {session: 'YYYY-MM-DD/HHMMSS'}   # REPLACE with a recorded session under ~/camera_video

actors:
  GUI: {package: actors.video_screen_3d, class: Visual3D, visual: VideoScreen3D}
  VideoScreen3D: {package: actors.video_screen_3d, class: VideoScreen3D}

  ProcessorBatch3D:
    package: actors.processor_batch3d
    class: ProcessorBatch3D
    pred_active: True
    triangulate: true
    align_frames: true       # replay: every camera's view in a step is the same video frame
    compute_cores: 7
    config_overrides:
      batch3d_backend: dlc
      dlc_onnx_frame_size: [960, 720]      # must match the videos (models/dlc_trt/dlc_detector_960x720.onnx)
      # dlc_engine: pytorch                # DeepLabCut's own runners instead of the ONNX default (config.yaml), to compare
      hand_association: geometric
      # must be the calibration of the replayed session's camera positions
      calibration_toml: 'calibration/<session>/calibration.toml'
    method: spawn

  SenderUDP: {package: actors.sender_udp, class: SenderUDP, method: spawn}

connections:
  ProcessorBatch3D.q_out: [SenderUDP.joints_in, VideoScreen3D.preds_in]

redis_config:
  port: 6379
