# DLC two-hand model + triangulation on a recorded session (no cameras).
#
#   Generator{slot} ─┬─> ProcessorBatch3D (backend dlc) ──> SenderUDP.joints_in, VideoScreen3D.preds_in
#                    └─> VideoScreen3D.images{slot}_in
#
# Recording: set `session` ('YYYY-MM-DD/HHMMSS' under ~/camera_video) once, in Generator0; the other Generators
# inherit it (<<: *gen) and only set camera_num. camera_nums in ProcessorBatch3D must list the same numbers in
# slot order. Add `subfolder: raw` to Generator0 to play the session's raw/ copies instead.
#
# hand_association: geometric -- each camera's right_*/left_* blocks are candidate hands, keypoints below
# config.yaml `threshold` are dropped, and a hand exists in 3D only where cameras agree; the triangulation weights
# each view by its DLC likelihood. "region" is the held-hand tracker of the 2026-09-16 stimulation runs (learns the
# hand's place in the first 10 s, left_* block only) -- needs that day's calibration and videos.
#
# Run: FES_CONDA_ENV=improvDLC3 fes-run dlc_hand_gen.yaml      (DLC 3.0.2 / onnxruntime-gpu are in improvDLC3)

actors:
  GUI: {package: actors.video_screen_3d, class: Visual3D, visual: VideoScreen3D}
  VideoScreen3D: {package: actors.video_screen_3d, class: VideoScreen3D, num_active_cameras: 4}

  Generator0: &gen {package: actors.generator, class: Generator, session: '2026-10-07/111100', camera_num: 0}
  Generator1: {<<: *gen, camera_num: 1}
  Generator2: {<<: *gen, camera_num: 3}
  Generator3: {<<: *gen, camera_num: 6}

  ProcessorBatch3D:
    package: actors.processor_batch3d
    class: ProcessorBatch3D
    num_cameras: 4
    camera_nums: [0, 1, 3, 6]
    pred_active: True
    triangulate: true
    align_frames: true       # replay: every camera's view in a step is the same video frame
    compute_cores: 7
    config_overrides:
      batch3d_backend: dlc
      dlc_engine: onnx                     # "pytorch" = DeepLabCut's own runners, to compare
      dlc_onnx_frame_size: [960, 720]      # must match the videos (models/dlc_trt/dlc_detector_960x720.onnx)
      # TensorRT for the pose net saves ~0.5 ms and logs a harmless parse error; the detector is CUDA-only
      dlc_onnx_pose_providers: [CUDAExecutionProvider, CPUExecutionProvider]
      hand_association: geometric
      # 10-07 00:14 board + 111100 hand keypoints (calibration/refine_calibration.py): hand in 3D 37% -> 43% of frames
      # on held-out 111100 frames. cam0/cam6 seem to have moved since 00:14 -- use this for that day's sessions only.
      calibration_toml: 'calibration/2026-10-07_001400/refined/calibration_board_hands.toml'
    method: spawn

  SenderUDP: {package: actors.sender_udp, class: SenderUDP, method: spawn}

connections:
  Generator0.q_out: [VideoScreen3D.images0_in, ProcessorBatch3D.frames0_in]
  Generator1.q_out: [VideoScreen3D.images1_in, ProcessorBatch3D.frames1_in]
  Generator2.q_out: [VideoScreen3D.images2_in, ProcessorBatch3D.frames2_in]
  Generator3.q_out: [VideoScreen3D.images3_in, ProcessorBatch3D.frames3_in]
  ProcessorBatch3D.q_out: [SenderUDP.joints_in, VideoScreen3D.preds_in]

redis_config:
  port: 6379
