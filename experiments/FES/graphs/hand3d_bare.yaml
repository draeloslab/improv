# BARE MINIMUM: 4 cameras -> ONNX MediaPipe (one hand per camera) -> raw 2D -> triangulate -> joint angles -> UDP.
# No smoothing, no prediction, no hold/glide, no cross-camera association logic, no 2D Kalman. Pair with BRAND
# graphs/monkey/rhodes_2d_vision_bare.yaml (vision + vision_dofs nodes, joint angles on UDP 11115).
#
#   CameraReader{slot} -+-> ProcessorBatch3D --+-> SenderUDP.joints_in --UDP :11115 joint angles (BRAND vision node)
#                       |                      +-> VideoScreen3D.preds_in
#                       +-> VideoScreen3D.images{slot}_in
#
# What ProcessorBatch3D does per step with these overrides:
#   1. newest frame from each camera (waits up to ~1 frame for the others)
#   2. ONNX MediaPipe per camera, num_hands 1 -> 21 2D keypoints + one hand score per camera
#   3. hand_association: label -> a camera's hand is dropped if its score < `threshold` (0.3); no geometry checks
#   4. aniposelib triangulation of each keypoint from every camera that has it (>= 2 cameras), else NaN
#   5. smoothing_3d: none -> the raw triangulated points
#   6. joint angles = angle between bones at each joint, deg (0 = straight); NaN joints are sent as null
# Joint names are the bare MP21 names (INDEX_MCP, RING_MCP, ...) because mediapipe_both_hands is off.
#
# Toggle things back on one at a time in config_overrides, e.g. smoothing_3d: {method: kalman},
# hand_association: geometric (+ geometric_association.hold_tol_px), mediapipe_num_hands: 2.
#
# Cameras: slots 0-3 = physical 0, 1, 3, 6 (calibration 2026-10-07_001400, config.yaml calibration_toml). Physical cam5 is
# left out: it sees the hand in only ~20% of frames, so it flips the triangulation set in and out (see human tuning notes).
# One hand (mediapipe_num_hands 1), as in 2026-10-06 Run-007, the cleanest human run.
#
# Run: SENDER_UDP_IP=<brand ip> FES_CONDA_ENV=improvDLC3 scripts/fes-run.sh hand3d_bare.yaml

actors:
  GUI:
    package: actors.video_screen_3d
    class: Visual3D
    visual: VideoScreen3D

  VideoScreen3D:
    package: actors.video_screen_3d
    class: VideoScreen3D
    num_active_cameras: 4

  Generator0: {package: actors.camera_reader, class: CameraReader, camera_num: 0}
  Generator1: {package: actors.camera_reader, class: CameraReader, camera_num: 1}
  Generator2: {package: actors.camera_reader, class: CameraReader, camera_num: 3}
  Generator3: {package: actors.camera_reader, class: CameraReader, camera_num: 6}

  ProcessorBatch3D:
    package: actors.processor_batch3d
    class: ProcessorBatch3D
    num_cameras: 4
    camera_nums: [0, 1, 3, 6]
    pred_active: True
    triangulate: true
    config_overrides:
      batch3d_backend: mediapipe
      mediapipe_engine: onnx
      onnx_providers: [[TensorrtExecutionProvider, {trt_fp16_enable: true}], CUDAExecutionProvider, CPUExecutionProvider]
      mediapipe_num_hands: 1
      mediapipe_both_hands: true     # one 21-keypoint hand, bare joint names
      hand_association: geometric         # plain per-camera triangulation, no geometric association / tracking
      kalman_enabled: false           # no 2D Kalman filter
      smoothing_3d: {method: kalman}    # no 3D Kalman / One-Euro / hold-and-glide
    method: spawn

  SenderUDP:
    package: actors.sender_udp
    class: SenderUDP
    method: spawn

connections:
  Generator0.q_out: [VideoScreen3D.images0_in, ProcessorBatch3D.frames0_in]
  Generator1.q_out: [VideoScreen3D.images1_in, ProcessorBatch3D.frames1_in]
  Generator2.q_out: [VideoScreen3D.images2_in, ProcessorBatch3D.frames2_in]
  Generator3.q_out: [VideoScreen3D.images3_in, ProcessorBatch3D.frames3_in]
  ProcessorBatch3D.q_out: [SenderUDP.joints_in, VideoScreen3D.preds_in]

redis_config:
  port: 6379
