actors:
  GUI:
    package: actors.visual_viz_stim
    class: DisplayVisual
    visual: Visual

  # Microscope:
  #   package: actors.load_disc
  #   class: FileAcquirer
  #   ip: '*'
  #   port: 5007
  #   output: output/
  #   init_filename: output/initialization.h5
  #   filename: data/data_032525_ds3.h5
  #   init_frame: 60
  #   framerate: 15

  Acquirer:
    package: actors.acquire_zmq
    class: ZMQAcquirer
    ip: 192.168.1.1 #127.0.0.1 # 10.65.110.3 #10.122.170.21
    ports: [50154, 5000,5007,5008,5009,5010,5011,4701,4703,5865,5005,5017,5018] #[4701,4702,4703]
    output: output/
    red_chan_image: output/red_channel_image.npy
    init_filename: output/initialization.h5
    init_frame: 60
    
  Stimulus:
    package: actors.stimulus_spots #_multi
    class: VisualStimulus
    ip: '*'
    port: 6006 
    stimuli: stimuli.npy
    # consider adding stimulus details like (stationary time, duration, hold after)

  Processor:
    package: actors.caiman_processor
    class: LiveTwoP
    init_filename: output/initialization.h5
    config_file: live_caiman_params.yaml

  Visual:
    package: actors.visual_viz_stim
    class: CaimanVisualStim
    
  Analysis:
    package: actors.analysis_viz #_multi
    class: VizStimAnalysis
    stimuli: stimuli.npy
    before_amount: 5
    after_amount: 10

    ## Optimimzer:
    # package: actors.bayes_opt
    # class: BayesOpt
    # config_file: bayesopt_params.yaml
    

connections:
  Acquirer.q_out: [Processor.q_in, Visual.raw_frame_queue]
  Processor.q_out: [Analysis.q_in]
  Analysis.q_out: [Visual.q_in]
  Acquirer.stim_queue: [Analysis.input_stim_queue, Visual.stim_in]
  Analysis.stim_out: [Stimulus.q_in]
  # Optimizer.stim_out: [Stimulus.stim_in] # this link is for sending next stim index
  Stimulus.q_out: [Visual.optim_in]
  # need a link for sending stim_flag from optimizer to stimulus (initial flag)

redis_config:
  port: 6379