actors:
  GUI:
    package: actors.video_screen
    class: Visual
    visual: VideoScreen

  # video screen: displaying the camera video frames
  VideoScreen:
    package: actors.video_screen
    class: VideoScreen
  
  # camera readers: each camera reader use the camera API for reading the frames
  CameraReader0:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 0

  CameraReader1:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 1

  CameraReader2:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 2

  Processor0:
    package: actors.processor
    class: Processor
    pred_active: False

  Processor1:
    package: actors.processor
    class: Processor
    pred_active: False

  Processor2:
    package: actors.processor
    class: Processor
    pred_active: True

connections:
  CameraReader0.q_out: [Processor0.q_in]
  CameraReader1.q_out: [Processor1.q_in]
  CameraReader2.q_out: [Processor2.q_in]
  Processor0.q_out: [VideoScreen.preds0_in]
  Processor1.q_out: [VideoScreen.preds1_in]
  Processor2.q_out: [VideoScreen.preds2_in]

redis_config:
  port: 6379