actors:
  # camera readers: each camera reader use the camera API for reading the frames
  CameraReader0:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 0
    logging_metrics: true # if true, log the metrics (fps, latency, etc)
    benchmarking: true # if true, save the benchmark performance into a file

  CameraReader1:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 1
    logging_metrics: true # if true, log the metrics (fps, latency, etc)
    benchmarking: true # if true, save the benchmark performance into a file

  CameraReader2:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 2
    logging_metrics: true # if true, log the metrics (fps, latency, etc)
    benchmarking: true # if true, save the benchmark performance into a file

  # video savers: each video saver writes the frames readed to raw-video file
  VideoSaver0:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 0

  VideoSaver1:
    package: actors.video_saver    
    class: VideoSaver
    camera_num: 1
    
  VideoSaver2:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 2

connections:
  CameraReader0.q_out: [VideoSaver0.q_in]
  VideoSaver0.msg_out: [CameraReader0.msg_in]

  CameraReader1.q_out: [VideoSaver1.q_in]
  VideoSaver1.msg_out: [CameraReader1.msg_in]

  CameraReader2.q_out: [VideoSaver2.q_in]
  VideoSaver2.msg_out: [CameraReader2.msg_in]

redis_config:
  port: 6379