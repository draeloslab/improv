actors:
  # gui class for displaying the video frames
  GUI:
    package: actors.video_screen
    class: Visual
    visual: VideoScreen

  # actor for starting the GUI
  VideoScreen:
    package: actors.video_screen
    class: VideoScreen
    num_active_cameras: 3
  
  # camera readers: each camera reader use the camera API for reading the frames
  CameraReader0:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 0
    logging_metrics: false # if true, log the metrics (fps, latency, etc)

  CameraReader1:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 1
    logging_metrics: false # if true, log the metrics (fps, latency, etc)

  CameraReader2:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 2
    logging_metrics: false # if true, log the metrics (fps, latency, etc)

  # video savers: each video saver writes the frames readed to raw-video file
  VideoSaver0:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 0

  VideoSaver1:
    package: actors.video_saver    
    class: VideoSaver
    camera_num: 1
    
  VideoSaver2:
    package: actors.video_saver
    class: VideoSaver
    camera_num: 2

connections:
  CameraReader0.q_out: [VideoSaver0.q_in, VideoScreen.camera0_in]
  VideoSaver0.msg_out: [VideoScreen.camera0_msg_in]

  CameraReader1.q_out: [VideoSaver1.q_in, VideoScreen.camera1_in]
  VideoSaver1.msg_out: [VideoScreen.camera1_msg_in]

  CameraReader2.q_out: [VideoSaver2.q_in, VideoScreen.camera2_in]
  VideoSaver2.msg_out: [VideoScreen.camera2_msg_in]

  VideoScreen.msg_out: [VideoSaver0.msg_in, VideoSaver1.msg_in, VideoSaver2.msg_in]

redis_config:
  port: 6379