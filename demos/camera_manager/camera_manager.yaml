actors:
  # gui class for displaying the video frames
  GUI:
    package: actors.video_screen
    class: Visual
    visual: VideoScreen

  # actor for starting the GUI
  VideoScreen:
    package: actors.video_screen
    class: VideoScreen
  
  # camera readers: each camera reader use the camera API for reading the frames
  CameraReader0:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 0

  CameraReader1:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 1

  CameraReader2:
    package: actors.camera_reader
    class: CameraReader
    camera_num: 2

  # video savers: each video saver writes the frames readed to raw-video file
  VideoSaver0:
    # package: actors.video_saver # old video saver (slow - max 30fps)
    package: actors.video_saver_multiproc_new
    class: VideoSaver
    camera_num: 0
    # method: spawn

  VideoSaver1:
    # package: actors.video_saver # old video saver (slow - max 30fps)
    package: actors.video_saver_multiproc_new    
    class: VideoSaver
    camera_num: 1
    # method: spawn
    
  VideoSaver2:
    # package: actors.video_saver # old video saver (slow - max 30fps)
    package: actors.video_saver_multiproc_new
    class: VideoSaver
    camera_num: 2
    # method: spawn

connections:
  CameraReader0.q_out: [VideoSaver0.q_in, VideoScreen.camera0_in]
  CameraReader1.q_out: [VideoSaver1.q_in, VideoScreen.camera1_in]
  CameraReader2.q_out: [VideoSaver2.q_in, VideoScreen.camera2_in]

redis_config:
  port: 6379